<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>🧪 FreshMart - Test Report</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; }
  h1 { color: #10b981; margin-bottom: 5px; }
  .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 12px 0; font-size: 16px; }
  .pass { color: #10b981; }
  .fail { color: #ef4444; }
  .warn { color: #f59e0b; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; }
  .badge-pass { background: #064e3b; color: #34d399; }
  .badge-fail { background: #450a0a; color: #fca5a5; }
  .badge-warn { background: #451a03; color: #fcd34d; }
  .test-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; }
  .test-row:last-child { border-bottom: none; }
  iframe { width: 100%; height: 500px; border: 2px solid #334155; border-radius: 8px; }
  #log { background: #020617; border: 1px solid #1e3a5f; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
  .log-info { color: #60a5fa; }
  .log-ok { color: #34d399; }
  .log-err { color: #f87171; }
  .log-warn { color: #fbbf24; }
  button { background: #059669; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; margin: 4px; }
  button:hover { background: #047857; }
  button.danger { background: #dc2626; }
  button.danger:hover { background: #b91c1c; }
  .summary-bar { background: #064e3b; border: 1px solid #10b981; border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 16px; }
  .count { font-size: 24px; font-weight: bold; }
  .count-label { font-size: 11px; color: #94a3b8; }
</style>
</head>
<body>

<h1>🧪 FreshMart Template — Test Report</h1>
<p class="subtitle">Automated Browser Verification | http://localhost:3000</p>

<div class="summary-bar" id="summary-bar">
  <div><div class="count pass" id="cnt-pass">0</div><div class="count-label">PASS</div></div>
  <div><div class="count fail" id="cnt-fail">0</div><div class="count-label">FAIL</div></div>
  <div><div class="count warn" id="cnt-warn">0</div><div class="count-label">WARN</div></div>
  <div style="margin-left: auto;">
    <button onclick="runAllTests()">▶ Run All Tests</button>
    <button onclick="clearLog()">🗑 Clear Log</button>
  </div>
</div>

<div class="card">
  <h2>📋 Test Cases</h2>
  <div id="test-list"></div>
</div>

<div class="card">
  <h2>📄 Live Preview (iframe)</h2>
  <iframe id="preview-frame" src="http://localhost:3000/" onload="onIframeLoad()"></iframe>
</div>

<div class="card">
  <h2>🖥 Console Log</h2>
  <div id="log"></div>
</div>

<script>
const tests = [
  { id: 'page-loads', name: 'Halaman berhasil dimuat (HTTP 200)', fn: testPageLoads },
  { id: 'no-loader', name: 'Loading overlay (#global-loader) hilang setelah 6 detik', fn: testLoaderHidden },
  { id: 'catalog-visible', name: 'Katalog produk (#product-container) terlihat', fn: testCatalogVisible },
  { id: 'header-visible', name: 'Header toko muncul', fn: testHeaderVisible },
  { id: 'categories', name: 'Kategori pills muncul', fn: testCategories },
  { id: 'product-cards', name: 'Produk cards ter-render (minimal 1)', fn: testProductCards },
  { id: 'bottom-nav', name: 'Bottom navigation bar muncul', fn: testBottomNav },
  { id: 'search-bar', name: 'Search bar ada dan bisa diketik', fn: testSearchBar },
  { id: 'product-modal', name: 'Modal produk terbuka saat card di-klik', fn: testProductModal },
  { id: 'add-to-cart', name: 'Tombol Masuk Keranjang berfungsi', fn: testAddToCart },
  { id: 'cart-view', name: 'Cart view menampilkan item', fn: testCartView },
  { id: 'wishlist-btn', name: 'Tombol Wishlist dapat di-klik', fn: testWishlist },
];

let results = {};
let iframe;
let iframeReady = false;

function log(msg, type='info') {
  const div = document.getElementById('log');
  const p = document.createElement('p');
  p.style.margin = '2px 0';
  const time = new Date().toLocaleTimeString();
  p.className = 'log-' + type;
  p.textContent = `[${time}] ${msg}`;
  div.appendChild(p);
  div.scrollTop = div.scrollHeight;
}

function clearLog() {
  document.getElementById('log').innerHTML = '';
}

function setResult(id, status, detail='') {
  results[id] = status;
  const row = document.getElementById('row-' + id);
  if (row) {
    const badge = row.querySelector('.badge');
    badge.className = 'badge badge-' + (status === 'pass' ? 'pass' : status === 'fail' ? 'fail' : 'warn');
    badge.textContent = status.toUpperCase();
  }
  updateSummary();
}

function updateSummary() {
  const vals = Object.values(results);
  document.getElementById('cnt-pass').textContent = vals.filter(v => v==='pass').length;
  document.getElementById('cnt-fail').textContent = vals.filter(v => v==='fail').length;
  document.getElementById('cnt-warn').textContent = vals.filter(v => v==='warn').length;
}

function buildTestList() {
  const div = document.getElementById('test-list');
  div.innerHTML = '';
  tests.forEach(t => {
    const row = document.createElement('div');
    row.className = 'test-row';
    row.id = 'row-' + t.id;
    row.innerHTML = `<span>${t.name}</span><span class="badge badge-warn" style="cursor:pointer;" onclick="runTest('${t.id}')">PENDING</span>`;
    div.appendChild(row);
  });
}

function getIframe() {
  return document.getElementById('preview-frame');
}

function getFrameDoc() {
  try {
    return getIframe().contentDocument || getIframe().contentWindow.document;
  } catch(e) { return null; }
}

function getFrameEl(id) {
  const doc = getFrameDoc();
  return doc ? doc.getElementById(id) : null;
}

function onIframeLoad() {
  iframeReady = true;
  log('iframe loaded: ' + getIframe().src, 'ok');
}

async function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// ============================================================
// TEST FUNCTIONS
// ============================================================

async function testPageLoads() {
  try {
    const res = await fetch('http://localhost:3000/');
    if (res.ok) {
      log('✅ Page HTTP ' + res.status, 'ok');
      return 'pass';
    } else {
      log('❌ Page HTTP ' + res.status, 'err');
      return 'fail';
    }
  } catch(e) {
    log('❌ Fetch failed: ' + e.message, 'err');
    return 'fail';
  }
}

async function testLoaderHidden() {
  log('⏳ Waiting 6s for loader to hide...', 'info');
  await sleep(6000);
  const loader = getFrameEl('global-loader');
  if (!loader) {
    log('⚠️ #global-loader element not found in iframe', 'warn');
    return 'warn';
  }
  const isHidden = loader.classList.contains('hidden') || 
                   loader.style.display === 'none' ||
                   window.getComputedStyle(loader).display === 'none' ||
                   loader.style.opacity === '0';
  if (isHidden) {
    log('✅ Loader is hidden!', 'ok');
    return 'pass';
  } else {
    log('❌ Loader is STILL VISIBLE. Classes: ' + loader.className, 'err');
    log('   Loader computed display: ' + window.getComputedStyle(loader).display, 'err');
    return 'fail';
  }
}

async function testCatalogVisible() {
  const container = getFrameEl('product-container');
  if (!container) { log('❌ #product-container not found', 'err'); return 'fail'; }
  const style = getFrameDoc().defaultView.getComputedStyle(container);
  if (style.display !== 'none' && style.visibility !== 'hidden') {
    log('✅ #product-container is visible', 'ok');
    return 'pass';
  }
  log('❌ #product-container is not visible', 'err');
  return 'fail';
}

async function testHeaderVisible() {
  const doc = getFrameDoc();
  if (!doc) { log('⚠️ Cannot access iframe document', 'warn'); return 'warn'; }
  const header = doc.querySelector('header') || doc.querySelector('[class*="header"]');
  if (header) { log('✅ Header element found', 'ok'); return 'pass'; }
  log('❌ No header element found', 'err');
  return 'fail';
}

async function testCategories() {
  const container = getFrameEl('dynamic-categories-container');
  if (!container) { log('❌ #dynamic-categories-container not found', 'err'); return 'fail'; }
  const children = container.children;
  if (children.length > 0) {
    log(`✅ Categories container has ${children.length} items`, 'ok');
    return 'pass';
  }
  log('⚠️ Category container is empty (may be still loading)', 'warn');
  return 'warn';
}

async function testProductCards() {
  const container = getFrameEl('product-container');
  if (!container) { log('❌ #product-container not found', 'err'); return 'fail'; }
  const cards = container.querySelectorAll('[onclick*="openProductModal"], .product-card, [data-id]');
  const allChildren = container.children;
  if (allChildren.length > 0) {
    log(`✅ Product container has ${allChildren.length} product cards`, 'ok');
    return 'pass';
  }
  log('⚠️ No product cards found in #product-container', 'warn');
  return 'warn';
}

async function testBottomNav() {
  const doc = getFrameDoc();
  if (!doc) { return 'warn'; }
  const nav = doc.querySelector('nav') || doc.querySelector('[class*="bottom"]') || doc.querySelector('[class*="nav"]');
  if (nav) { log('✅ Navigation element found', 'ok'); return 'pass'; }
  log('⚠️ No nav element found', 'warn');
  return 'warn';
}

async function testSearchBar() {
  const doc = getFrameDoc();
  if (!doc) { return 'warn'; }
  const search = doc.getElementById('search-input') || doc.querySelector('input[type="search"]') || doc.querySelector('input[placeholder*="Cari"]');
  if (search) {
    log('✅ Search input found: ' + (search.id || search.placeholder), 'ok');
    return 'pass';
  }
  log('❌ Search input not found', 'err');
  return 'fail';
}

async function testProductModal() {
  const doc = getFrameDoc();
  if (!doc) { return 'warn'; }
  const container = getFrameEl('product-container');
  if (!container || container.children.length === 0) {
    log('⚠️ No products loaded, cannot test modal', 'warn');
    return 'warn';
  }
  // Click first product card
  const firstCard = container.children[0];
  firstCard.click();
  await sleep(500);
  const modal = doc.getElementById('product-modal') || doc.querySelector('[id*="product-modal"]');
  if (modal) {
    const isVisible = !modal.classList.contains('hidden');
    if (isVisible) {
      log('✅ Product modal opened after clicking card', 'ok');
      return 'pass';
    }
    log('⚠️ Modal exists but has hidden class', 'warn');
    return 'warn';
  }
  log('❌ Product modal element not found', 'err');
  return 'fail';
}

async function testAddToCart() {
  const doc = getFrameDoc();
  if (!doc) { return 'warn'; }
  const addBtn = doc.querySelector('[onclick*="addToCart"]') || doc.querySelector('#btn-add-to-cart') || doc.querySelector('[id*="add-to-cart"]');
  if (!addBtn) { log('⚠️ Add to cart button not found (modal may not be open)', 'warn'); return 'warn'; }
  addBtn.click();
  await sleep(500);
  const cartCount = doc.getElementById('cart-count') || doc.querySelector('[id*="cart-count"]');
  if (cartCount && parseInt(cartCount.textContent || '0') > 0) {
    log('✅ Item added to cart! Count: ' + cartCount.textContent, 'ok');
    return 'pass';
  }
  log('⚠️ Cart count not updated (may still work)', 'warn');
  return 'warn';
}

async function testCartView() {
  const doc = getFrameDoc();
  if (!doc) { return 'warn'; }
  const cartBtn = doc.querySelector('[onclick*="showView(\'cart\')"]') || doc.querySelector('[onclick*="showCart"]') || doc.querySelector('[id*="nav-cart"]');
  if (!cartBtn) { log('⚠️ Cart nav button not found', 'warn'); return 'warn'; }
  cartBtn.click();
  await sleep(500);
  const cartView = doc.getElementById('view-cart');
  if (cartView && !cartView.classList.contains('hidden')) {
    log('✅ Cart view is visible', 'ok');
    return 'pass';
  }
  log('⚠️ Cart view not visible after clicking cart nav', 'warn');
  return 'warn';
}

async function testWishlist() {
  const doc = getFrameDoc();
  if (!doc) { return 'warn'; }
  const wishBtn = doc.querySelector('[onclick*="showView(\'wishlist\')"]') || doc.querySelector('[onclick*="Wishlist"]') || doc.querySelector('[id*="nav-wish"]');
  if (wishBtn) { log('✅ Wishlist button found', 'ok'); return 'pass'; }
  log('⚠️ Wishlist button not found', 'warn');
  return 'warn';
}

async function runTest(id) {
  const test = tests.find(t => t.id === id);
  if (!test) return;
  log(`Running: ${test.name}`, 'info');
  setResult(id, 'warn');
  try {
    const result = await test.fn();
    setResult(id, result);
    log(`Result [${id}]: ${result.toUpperCase()}`, result === 'pass' ? 'ok' : result === 'fail' ? 'err' : 'warn');
  } catch(e) {
    setResult(id, 'fail');
    log(`Error in [${id}]: ${e.message}`, 'err');
  }
}

async function runAllTests() {
  log('=== Starting all tests ===', 'info');
  for (const test of tests) {
    await runTest(test.id);
    await sleep(300);
  }
  log('=== All tests complete ===', 'ok');
}

// Init
buildTestList();
log('Test runner initialized. Click "Run All Tests" to start.', 'info');
log('Preview iframe loading: http://localhost:3000/', 'info');
</script>
</body>
</html>
