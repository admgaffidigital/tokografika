<!-- ========================================================================= -->
<!-- VIEW: WISHLIST / FAVORIT                                                  -->
<!-- ========================================================================= -->
<div class='view-section flex flex-col fade-in bg-slate-50 dark:bg-slate-900 hidden' id='view-wishlist'>
  <div class='glass-header shrink-0 px-4 py-3 flex justify-center z-30 sticky top-0'>
    <div class='flex items-center justify-between w-full max-w-3xl lg:max-w-4xl'>
      <button class='w-9 h-9 flex items-center justify-center rounded-full bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700 transition-all shadow-sm' onclick='changeView(&apos;view-catalog&apos;)'>
        <i class='fa-solid fa-arrow-left text-sm'></i>
      </button>
      <h1 class='text-sm font-semibold text-slate-900 dark:text-white tracking-tight'>Favorit Saya</h1>
      <button class='w-9 h-9 flex items-center justify-center rounded-full bg-rose-50 dark:bg-rose-900/30 border-2 border-rose-200 dark:border-rose-800 text-rose-500 dark:text-rose-400 hover:bg-rose-100 dark:hover:bg-rose-900/50 transition-all shadow-sm hidden' id='btn-clear-wishlist' onclick='clearWishlist()'>
        <i class='fa-solid fa-trash-can text-xs'></i>
      </button>
      <div class='w-9 hidden' id='spacer-wishlist'></div>
    </div>
  </div>
  
  <div class='scroll-content flex-1 overflow-y-auto z-10 pt-4 pb-12'>
    <div class='flex flex-col items-center justify-center h-[50vh] hidden px-5 text-center max-w-xs mx-auto' id='wishlist-empty-state'>
      <div class='w-20 h-20 bg-rose-50 dark:bg-rose-900/20 border-2 border-rose-100 dark:border-rose-800/50 rounded-full flex items-center justify-center mb-4 text-rose-300 dark:text-rose-600'>
        <i class='fa-solid fa-heart text-4xl'></i>
      </div>
      <h3 class='font-bold text-slate-800 dark:text-white text-base mb-1'>Belum Ada Favorit</h3>
      <p class='text-slate-500 dark:text-slate-400 text-xs font-medium'>Kumpulkan produk impianmu di sini.</p>
    </div>
    <div class='px-4 space-y-3 max-w-3xl lg:max-w-4xl mx-auto w-full' id='wishlist-items-container'></div>
  </div>
</div>
