<!-- ========================================================================= -->
<!-- VIEW: ADMIN DASHBOARD & POS                                               -->
<!-- ========================================================================= -->
<div class='view-section flex flex-col fade-in bg-transparent z-10 hidden min-h-screen' id='view-admin'>
  <div class='glass-header shrink-0 px-3.5 sm:px-6 lg:px-8 py-2.5 sm:py-3 flex items-center justify-center z-30 sticky top-0'>
    <div class='flex items-center justify-between w-full max-w-7xl gap-2'>
      <div class='flex items-center gap-2 sm:gap-3 min-w-0 flex-1'>
        <button class='hidden w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 border border-white/30 text-white transition-all shadow-sm shrink-0' id='btn-admin-back' onclick='history.back()'>
          <i class='fa-solid fa-arrow-left text-xs sm:text-sm text-white'></i>
        </button>
        <div class='w-9 h-9 sm:w-11 sm:h-11 rounded-2xl bg-white/20 text-white flex items-center justify-center shadow-xs border border-white/30 transition-all shrink-0' id='admin-logo-box'>
          <i class='fa-solid fa-layer-group text-sm sm:text-base'></i>
        </div>
        <div class='min-w-0 flex-1'>
          <div class='flex items-center gap-1.5 flex-wrap'>
            <h1 class='text-sm sm:text-lg font-black tracking-tight text-white truncate' id='admin-header-title'>CMS Toko</h1>
            <div id='admin-pro-badge'></div>
          </div>
          <p class='text-[9px] sm:text-[11px] font-semibold text-white/90 uppercase tracking-wider truncate mt-0.5'>Mode Admin</p>
        </div>
      </div>
      <div class='flex items-center gap-1.5 sm:gap-2 shrink-0'>
        <button type='button' class='px-2.5 sm:px-3 py-1.5 sm:py-2 bg-white/20 hover:bg-white/30 border border-white/30 text-white rounded-xl text-[10px] font-bold transition-all shadow-sm flex items-center gap-1 backdrop-blur-sm active:scale-95' onclick='openCmsGuide()' title='Buku Panduan & Bantuan'>
          <i class='fa-solid fa-circle-question text-amber-300'></i> <span class='hidden sm:inline'>Panduan</span>
        </button>
        <button class='px-2.5 sm:px-3 py-1.5 sm:py-2 bg-white/20 hover:bg-white/30 border border-white/30 text-white rounded-xl text-[10px] font-bold transition-all shadow-sm flex items-center gap-1 backdrop-blur-sm active:scale-95' onclick='changeView(&apos;view-catalog&apos;)'>
          <i class='fa-solid fa-eye'></i> <span class='hidden sm:inline'>Lihat Toko</span>
        </button>
        <button class='px-2.5 sm:px-3 py-1.5 sm:py-2 bg-rose-500/90 hover:bg-rose-600 border border-rose-400/40 text-white rounded-xl text-[10px] font-bold transition-all shadow-sm flex items-center gap-1 backdrop-blur-sm active:scale-95' onclick='logoutAdmin()'>
          <i class='fa-solid fa-power-off'></i> <span class='hidden sm:inline'>Keluar</span>
        </button>
      </div>
    </div>
  </div>
  
  <div class='scroll-content flex-1 overflow-y-auto w-full pb-16 relative'>
    <div class='max-w-7xl mx-auto pt-6 px-4 sm:px-6 lg:px-8 w-full'>
      <div class='fade-in-scale block' id='admin-dashboard-view'>
        <div class='flex items-center justify-between mb-5 px-1'>
          <h3 class='font-bold text-slate-800 dark:text-white text-lg'>Menu Utama</h3>
          <button type='button' onclick='openCmsGuide()' class='text-xs font-bold text-slate-500 hover:text-emerald-600 dark:text-slate-400 flex items-center gap-1.5 py-1 px-2.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700/80 shadow-sm transition-all'>
            <i class='fa-solid fa-book-bookmark text-amber-500'></i>
            <span>Buku Panduan CMS</span>
          </button>
        </div>
        
        <div class='grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5 sm:gap-4 pb-8'>
          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-emerald-300/80 dark:border-emerald-700/80 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group relative overflow-hidden active:scale-95' onclick='initPosView()'>
            <div class='absolute top-2 right-2 bg-emerald-500 text-white text-[8px] font-black px-2 py-0.5 rounded-md uppercase tracking-wider shadow-sm'>
              POS
            </div>
            <div class='w-12 h-12 rounded-xl flex items-center justify-center group-hover:scale-105 transition-all duration-200 bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400'>
              <i class='fa-solid fa-cash-register text-xl'></i>
            </div>
            <span class='text-[11px] font-black text-slate-800 dark:text-slate-200 uppercase tracking-wider'>POS Kasir</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' onclick='openAdminTab(&apos;orders&apos;)'>
            <div class='w-12 h-12 rounded-xl flex items-center justify-center group-hover:scale-105 transition-all duration-200' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
              <i class='fa-solid fa-receipt text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Pesanan</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-slate-300 dark:hover:border-slate-600 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' onclick='openAdminTab(&apos;settings&apos;)'>
            <div class='w-12 h-12 rounded-xl bg-slate-100 dark:bg-slate-700/50 text-slate-600 dark:text-slate-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-gear text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Toko</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' onclick='openAdminTab(&apos;products&apos;)'>
            <div class='w-12 h-12 rounded-xl flex items-center justify-center group-hover:scale-105 transition-all duration-200' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
              <i class='fa-solid fa-box-open text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Produk</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' onclick='openAdminTab(&apos;categories&apos;)'>
            <div class='w-12 h-12 rounded-xl flex items-center justify-center group-hover:scale-105 transition-all duration-200' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
              <i class='fa-solid fa-tags text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Kategori</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-purple-200 dark:hover:border-purple-500/30 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' onclick='openAdminTab(&apos;vouchers&apos;)'>
            <div class='w-12 h-12 rounded-xl bg-purple-50 dark:bg-purple-500/10 text-purple-600 dark:text-purple-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-ticket text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Voucher</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-indigo-200 dark:hover:border-indigo-500/30 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' onclick='openAdminTab(&apos;banks&apos;)'>
            <div class='w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-building-columns text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Rekening</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-pink-200 dark:hover:border-pink-500/30 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' onclick='openAdminTab(&apos;banners&apos;)'>
            <div class='w-12 h-12 rounded-xl bg-pink-50 dark:bg-pink-500/10 text-pink-500 dark:text-pink-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-images text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Banner</span>
          </button>
          
          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' id='btn-menu-accounts' onclick='openAdminTab(&apos;accounts&apos;)'>
            <div class='w-12 h-12 rounded-xl flex items-center justify-center group-hover:scale-105 transition-all duration-200' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
              <i class='fa-solid fa-users-gear text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Kasir</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-emerald-300 dark:hover:border-emerald-500/30 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' id='btn-menu-reports' onclick='openAdminTab(&apos;reports&apos;)'>
            <div class='w-12 h-12 rounded-xl bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-chart-line text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Laporan Laba</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-teal-300 dark:hover:border-teal-500/30 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' id='btn-menu-purchases' onclick='openAdminTab(&apos;purchases&apos;)'>
            <div class='w-12 h-12 rounded-xl bg-teal-50 dark:bg-teal-500/10 text-teal-600 dark:text-teal-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-cart-flatbed text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Pembelian & Hutang</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-cyan-300 dark:hover:border-cyan-500/30 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' id='btn-menu-stock-opname' onclick='openAdminTab(&apos;stock_opname&apos;)'>
            <div class='w-12 h-12 rounded-xl bg-cyan-50 dark:bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-clipboard-check text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Stok Opname</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-rose-300 dark:hover:border-rose-500/30 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' id='btn-menu-pricetag' onclick='openPricetagModal()'>
            <div class='w-12 h-12 rounded-xl bg-rose-50 dark:bg-rose-500/10 text-rose-600 dark:text-rose-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-tags text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Pricetag Studio</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' id='btn-menu-backup-sync' onclick='openBackupSyncModal()'>
            <div class='w-12 h-12 rounded-xl flex items-center justify-center group-hover:scale-105 transition-all duration-200' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
              <i class='fa-solid fa-cloud-arrow-up text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Backup & Cloud</span>
          </button>

          <button class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm hover:shadow-md hover:border-amber-300 dark:hover:border-amber-500/30 hover:-translate-y-0.5 transition-all duration-200 flex flex-col items-center justify-center gap-3 group active:scale-95' onclick='openCmsGuide()'>
            <div class='w-12 h-12 rounded-xl bg-amber-50 dark:bg-amber-500/10 text-amber-600 dark:text-amber-400 flex items-center justify-center group-hover:scale-105 transition-all duration-200'>
              <i class='fa-solid fa-book-open-reader text-xl'></i>
            </div>
            <span class='text-[11px] font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider'>Panduan CMS</span>
          </button>
        </div>
      </div>
      
      <div class='hidden fade-in' id='admin-content-view'>
        <div id='admin-content'></div>
      </div>
    </div>
  </div>
</div>
<input accept='.json' class='hidden' id='restore-file' onchange='restoreData(event)' type='file'/>
