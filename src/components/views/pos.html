<!-- ========================================================================= -->
<!-- VIEW: POS KASIR (POINT OF SALE)                                           -->
<!-- ========================================================================= -->
<div class='view-section flex flex-col fade-in bg-slate-100 dark:bg-[#090e1a] z-50 hidden min-h-screen' id='view-pos'>
  <!-- POS Top Glass Header -->
  <div class='glass-header shrink-0 px-3 sm:px-6 py-2.5 flex items-center justify-between sticky top-0 z-30 shadow-md'>
    <div class='flex items-center gap-3'>
      <div class='w-10 h-10 rounded-xl bg-white/20 text-white flex items-center justify-center shadow-md border border-white/30 shrink-0'>
        <i class='fa-solid fa-cash-register text-lg'></i>
      </div>
      <div>
        <div class='flex items-center gap-2'>
          <h1 class='text-sm sm:text-base font-extrabold tracking-tight text-white' id='pos-store-name'>POS Kasir</h1>
          <span class='bg-white/20 text-white border border-white/30 text-[9px] font-bold px-2 py-0.5 rounded-full' id='pos-role-badge'>KASIR</span>
        </div>
        <p class='text-[10px] font-semibold text-white/90 flex items-center gap-1.5'>
          <i class='fa-solid fa-user-circle text-xs'></i>
          <span id='pos-cashier-name'>Petugas Kasir</span>
          <span class='opacity-50'>•</span>
          <span id='pos-clock' class='font-mono'>00:00:00</span>
        </p>
      </div>
    </div>

    <!-- POS Top Actions -->
    <div class='flex items-center gap-2'>
      <button class='w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-white/20 hover:bg-white/30 border border-white/30 text-white flex items-center justify-center text-sm transition-all shadow-sm active:scale-95' onclick='openCameraScanner()' title='Scan Barcode Kamera'>
        <i class='fa-solid fa-qrcode'></i>
      </button>
      <button class='hidden sm:flex items-center gap-1.5 px-3 py-2 rounded-xl bg-white/20 hover:bg-white/30 border border-white/30 text-white text-xs font-bold transition-all shadow-sm active:scale-95' id='btn-pos-to-admin' onclick='changeView(&quot;view-admin&quot;); openAdminMenu();' title='Buka CMS Pengaturan'>
        <i class='fa-solid fa-gear text-xs'></i>
        <span>CMS Toko</span>
      </button>
      <button class='px-3 py-2 rounded-xl bg-rose-500/90 hover:bg-rose-600 border border-rose-400/40 text-white text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 active:scale-95' onclick='logoutAdmin()' title='Keluar / Ganti Kasir'>
        <i class='fa-solid fa-power-off text-xs'></i>
        <span class='hidden sm:inline'>Tutup Kasir</span>
      </button>
    </div>
  </div>

  <!-- POS Main Body (2 Columns on Desktop/Tablet, Responsive on Mobile) -->
  <div class='flex-1 flex flex-col lg:flex-row overflow-hidden relative'>
    
    <!-- LEFT PANE: PRODUCT CATALOG & SEARCH -->
    <div class='flex-1 flex flex-col min-w-0 border-r border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-[#0b1329] overflow-hidden'>
      <!-- Search & Filter Bar -->
      <div class='p-3 sm:p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm shrink-0 flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center'>
        <div class='relative flex-1'>
          <i class='fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-xs'></i>
          <input class='w-full pl-10 pr-9 py-2.5 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-theme-primary text-slate-800 dark:text-white placeholder:text-slate-400 transition-all' id='pos-search-input' placeholder='Cari nama atau ketik/scan barcode...' type='text' autocomplete='off' oninput='handlePosSearch(this.value)'/>
          <button class='absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-500 hidden' id='pos-btn-clear-search' onclick='clearPosSearch()'>
            <i class='fa-solid fa-xmark text-sm'></i>
          </button>
        </div>
        <!-- POS Categories -->
        <div class='flex items-center gap-1.5 overflow-x-auto hide-scrollbar py-0.5' id='pos-categories-container'></div>
      </div>

      <!-- POS Product Grid -->
      <div class='flex-1 overflow-y-auto p-3 sm:p-4 custom-scrollbar' id='pos-products-scroll'>
        <div class='grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 xl:grid-cols-5 gap-2.5 sm:gap-3.5' id='pos-product-grid'></div>
      </div>
    </div>

    <!-- RIGHT PANE: POS CART & ORDER TOTAL -->
    <div class='w-full lg:w-[380px] xl:w-[420px] shrink-0 bg-white dark:bg-slate-900 flex flex-col border-t lg:border-t-0 shadow-lg z-20'>
      <!-- Cart Header -->
      <div class='p-3 sm:p-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0 bg-slate-50/50 dark:bg-slate-900/50'>
        <div class='flex items-center gap-2'>
          <i class='fa-solid fa-cart-shopping text-emerald-600 dark:text-emerald-400 text-sm'></i>
          <h2 class='font-bold text-sm text-slate-900 dark:text-white'>Keranjang Transaksi</h2>
          <span class='badge badge-xs badge-emerald font-extrabold' id='pos-cart-count'>0 Item</span>
        </div>
        <button class='text-xs font-bold text-rose-500 hover:text-rose-600 dark:hover:text-rose-400 flex items-center gap-1 transition-colors' onclick='clearPosCart()'>
          <i class='fa-solid fa-trash-can text-[11px]'></i> Kosongkan
        </button>
      </div>

      <!-- Cart Item List -->
      <div class='flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar min-h-[160px] lg:min-h-0' id='pos-cart-items-container'>
        <div class='h-full flex flex-col items-center justify-center text-center p-6 text-slate-400 dark:text-slate-500' id='pos-cart-empty'>
          <i class='fa-solid fa-basket-shopping text-4xl mb-2 opacity-40'></i>
          <p class='text-xs font-bold'>Keranjang Masih Kosong</p>
          <p class='text-[10px] mt-0.5 opacity-80'>Klik produk di katalog atau scan barcode untuk menambah</p>
        </div>
      </div>

      <!-- Cart Summary & Payment Action -->
      <div class='p-4 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-[#0b1329] space-y-3 shrink-0'>
        <div class='space-y-1.5 text-xs font-semibold'>
          <div class='flex justify-between text-slate-600 dark:text-slate-400'>
            <span>Subtotal</span>
            <span class='font-bold text-slate-900 dark:text-white' id='pos-summary-subtotal'>Rp 0</span>
          </div>
          <div class='flex justify-between text-slate-600 dark:text-slate-400'>
            <span>Diskon Grosir / Promo</span>
            <span class='font-bold text-emerald-600 dark:text-emerald-400' id='pos-summary-discount'>Rp 0</span>
          </div>
          <div class='pt-2 border-t border-slate-200 dark:border-slate-800 flex justify-between items-baseline'>
            <span class='text-sm font-extrabold text-slate-900 dark:text-white uppercase tracking-wide'>Total Bayar</span>
            <span class='text-xl sm:text-2xl font-black text-emerald-600 dark:text-emerald-400' id='pos-summary-total'>Rp 0</span>
          </div>
        </div>

        <button class='btn-primary w-full !py-3.5 !text-base !font-extrabold shadow-xl hover:-translate-y-0.5 active:scale-95 disabled:opacity-50 disabled:pointer-events-none' id='btn-pos-pay' onclick='openPosPaymentModal()' disabled>
          <i class='fa-solid fa-money-bill-wave mr-1'></i> Bayar Sekarang
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ========================================================================= -->
<!-- MODAL: POS QUICK PAYMENT (PEMBAYARAN KILAT KASIR)                         -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[80] bg-slate-900/70 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-3 sm:p-5' id='pos-payment-modal' onclick='if(event.target===this) closePosPaymentModal()'>
  <div class='w-full max-w-lg bg-white dark:bg-slate-800 rounded-[2rem] shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden flex flex-col transform scale-95 transition-transform duration-300' id='pos-payment-box'>
    
    <!-- Modal Header -->
    <div class='px-6 py-4 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between'>
      <div class='flex items-center gap-2.5'>
        <div class='w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm font-bold'>
          <i class='fa-solid fa-wallet'></i>
        </div>
        <h3 class='font-bold text-sm sm:text-base text-slate-900 dark:text-white'>Pembayaran Kasir</h3>
      </div>
      <button class='w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-rose-500 hover:text-white flex items-center justify-center text-xs transition-colors' onclick='closePosPaymentModal()'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>

    <!-- Modal Content -->
    <div class='p-5 sm:p-6 space-y-4 max-h-[80vh] overflow-y-auto custom-scrollbar'>
      <!-- Total Tagihan -->
      <div class='bg-emerald-50 dark:bg-emerald-950/40 p-4 rounded-2xl border border-emerald-200 dark:border-emerald-800/60 text-center'>
        <p class='text-[10px] font-bold text-emerald-800 dark:text-emerald-400 uppercase tracking-widest mb-1'>Total Tagihan</p>
        <h2 class='text-2xl sm:text-3xl font-black text-emerald-600 dark:text-emerald-400' id='pos-modal-total-display'>Rp 0</h2>
      </div>

      <!-- Pilihan Metode Pembayaran -->
      <div>
        <label class='text-xs font-bold text-slate-700 dark:text-slate-300 mb-2 block uppercase tracking-wider'>Metode Pembayaran</label>
        <div class='grid grid-cols-2 sm:grid-cols-4 gap-2' id='pos-payment-method-selector'>
          <button type='button' class='p-2.5 rounded-xl border-2 font-bold text-xs flex flex-col items-center gap-1.5 transition-all pos-method-btn active-method border-emerald-500 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-300' data-method='cash' onclick='setPosPaymentMethod(&quot;cash&quot;)'>
            <i class='fa-solid fa-money-bill-wave text-base text-emerald-600'></i>
            <span>Tunai</span>
          </button>
          <button type='button' class='p-2.5 rounded-xl border-2 font-bold text-xs flex flex-col items-center gap-1.5 transition-all pos-method-btn border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:border-slate-300' data-method='qris' onclick='setPosPaymentMethod(&quot;qris&quot;)'>
            <i class='fa-solid fa-qrcode text-base text-slate-500'></i>
            <span>QRIS</span>
          </button>
          <button type='button' class='p-2.5 rounded-xl border-2 font-bold text-xs flex flex-col items-center gap-1.5 transition-all pos-method-btn border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:border-slate-300' data-method='transfer' onclick='setPosPaymentMethod(&quot;transfer&quot;)'>
            <i class='fa-solid fa-building-columns text-base text-slate-500'></i>
            <span>Transfer</span>
          </button>
          <button type='button' class='p-2.5 rounded-xl border-2 font-bold text-xs flex flex-col items-center gap-1.5 transition-all pos-method-btn border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:border-slate-300' data-method='edc' onclick='setPosPaymentMethod(&quot;edc&quot;)'>
            <i class='fa-solid fa-credit-card text-base text-slate-500'></i>
            <span>Debit/EDC</span>
          </button>
        </div>
      </div>

      <!-- Section Khusus Tunai (Input Cash & Kembalian) -->
      <div id='pos-cash-input-section' class='space-y-3 pt-2'>
        <div>
          <label class='text-xs font-bold text-slate-700 dark:text-slate-300 mb-1.5 block uppercase tracking-wider'>Uang Diterima (Rp)</label>
          <input type='number' id='pos-cash-received-input' class='w-full text-lg sm:text-xl font-black px-4 py-3 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white' placeholder='0' oninput='calculatePosChange()'/>
        </div>

        <!-- Quick Cash Buttons -->
        <div class='flex flex-wrap gap-1.5' id='pos-quick-cash-buttons'>
          <button type='button' class='px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors' onclick='setQuickCash(&quot;exact&quot;)'>Uang Pas</button>
          <button type='button' class='px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors' onclick='setQuickCash(10000)'>10.000</button>
          <button type='button' class='px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors' onclick='setQuickCash(20000)'>20.000</button>
          <button type='button' class='px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors' onclick='setQuickCash(50000)'>50.000</button>
          <button type='button' class='px-3 py-1.5 bg-slate-100 dark:bg-slate-700/60 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-xs font-bold text-slate-700 dark:text-slate-200 transition-colors' onclick='setQuickCash(100000)'>100.000</button>
        </div>

        <!-- Kembalian Display -->
        <div class='p-3.5 bg-slate-100 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-between'>
          <span class='text-xs font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider'>Kembalian</span>
          <span class='text-lg font-black text-emerald-600 dark:text-emerald-400' id='pos-change-display'>Rp 0</span>
        </div>
      </div>

      <!-- Nama Pembeli / Pelanggan POS (Opsional) -->
      <div>
        <label class='text-xs font-bold text-slate-700 dark:text-slate-300 mb-1 block uppercase tracking-wider'>Nama Pelanggan (Opsional)</label>
        <input type='text' id='pos-customer-name' class='w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white' placeholder='Pelanggan Umum (Walk-in)'/>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class='p-4 bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 flex gap-2.5'>
      <button type='button' class='px-4 py-3 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-bold hover:bg-slate-300 transition-colors' onclick='closePosPaymentModal()'>Batal</button>
      <button type='button' class='btn-primary flex-1 !py-3 !text-sm !font-bold' id='btn-pos-submit-order' onclick='submitPosTransaction()'>
        <i class='fa-solid fa-check mr-1'></i> Simpan &amp; Cetak Struk
      </button>
    </div>
  </div>
</div>
