<!-- ========================================================================= -->
<!-- VIEW: POS KASIR (POINT OF SALE) - UNIVERSAL FLOATING CART SYSTEM          -->
<!-- ========================================================================= -->
<div class='view-section flex flex-col fade-in bg-slate-100 dark:bg-[#070c18] z-50 hidden h-full max-h-screen overflow-hidden' id='view-pos'>
  
  <!-- POS Top Navigation Bar -->
  <div class='glass-header shrink-0 px-3 sm:px-6 py-2.5 flex items-center justify-between sticky top-0 z-30 shadow-sm'>
    <div class='flex items-center gap-2.5 min-w-0'>
      <div class='w-8 h-8 sm:w-9 sm:h-9 rounded-xl bg-white/20 text-white flex items-center justify-center shadow-sm border border-white/30 shrink-0'>
        <i class='fa-solid fa-cash-register text-sm sm:text-base'></i>
      </div>
      <div class='min-w-0'>
        <div class='flex items-center gap-1.5'>
          <h1 class='text-xs sm:text-sm font-black tracking-tight text-white truncate' id='pos-store-name'>POS Kasir</h1>
          <span class='bg-white/20 text-white border border-white/30 text-[8px] sm:text-[9px] font-black px-2 py-0.2 rounded-full shrink-0' id='pos-role-badge'>KASIR</span>
        </div>
        <p class='text-[9px] sm:text-[10px] font-medium text-white/90 flex items-center gap-1 truncate'>
          <i class='fa-solid fa-user-circle text-[10px]'></i>
          <span id='pos-cashier-name' class='font-bold truncate'>Petugas Kasir</span>
          <span class='opacity-50'>•</span>
          <span id='pos-clock' class='font-mono font-bold shrink-0'>00:00:00</span>
        </p>
      </div>
    </div>

    <!-- POS Top Actions -->
    <div class='flex items-center gap-1.5 sm:gap-2 shrink-0'>
      <!-- Open Floating Cart Top Shortcut -->
      <button type='button' class='relative px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl bg-white/20 hover:bg-white/30 border border-white/30 text-white text-xs font-bold transition-all shadow-sm flex items-center gap-1.5 active:scale-95' onclick='openPosCartDrawer()' title='Buka Keranjang Transaksi'>
        <i class='fa-solid fa-cart-shopping text-xs'></i>
        <span class='hidden sm:inline'>Keranjang</span>
        <span class='badge-counter -top-1 -right-1 !h-4 !min-w-[16px] text-[8px]' id='pos-top-cart-badge'>0</span>
      </button>

      <button class='hidden md:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white/20 hover:bg-white/30 border border-white/30 text-white text-[11px] font-bold transition-all shadow-sm active:scale-95' id='btn-pos-to-admin' onclick='changeView(&quot;view-admin&quot;); openAdminMenu();' title='Buka CMS Pengaturan'>
        <i class='fa-solid fa-gear text-xs'></i>
        <span>CMS Toko</span>
      </button>
      
      <button class='px-2.5 sm:px-3 py-1.5 rounded-xl bg-rose-500/90 hover:bg-rose-600 border border-rose-400/40 text-white text-[10px] sm:text-[11px] font-bold transition-all shadow-sm flex items-center gap-1 active:scale-95' onclick='logoutAdmin()' title='Keluar / Ganti Kasir'>
        <i class='fa-solid fa-power-off text-xs'></i>
        <span class='hidden sm:inline'>Tutup Kasir</span>
      </button>
    </div>
  </div>

  <!-- POS Main Body: Full Canvas Catalog -->
  <div class='flex-1 flex flex-col min-w-0 min-h-0 bg-slate-50 dark:bg-[#0b1329] overflow-hidden relative'>
    
    <!-- Search, Scanner, View Toggle & Category Header -->
    <div class='p-2.5 sm:p-4 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 shadow-sm shrink-0 flex flex-col gap-2.5'>
      <div class='flex items-center gap-2'>
        <!-- Unified Search & Scan Input -->
        <div class='relative flex-1'>
          <i class='fa-solid fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 dark:text-slate-500 text-xs'></i>
          <input class='w-full pl-9 pr-16 py-2 sm:py-2.5 bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-xs sm:text-sm font-semibold focus:outline-none focus:border-theme-primary text-slate-800 dark:text-white placeholder:text-slate-400 transition-all' id='pos-search-input' placeholder='Cari nama atau ketik/scan barcode...' type='text' autocomplete='off' oninput='handlePosSearch(this.value)'/>
          
          <button class='absolute right-9 top-1/2 -translate-y-1/2 text-slate-400 hover:text-rose-500 hidden w-6 h-6 flex items-center justify-center' id='pos-btn-clear-search' onclick='clearPosSearch()' title='Hapus Pencarian'>
            <i class='fa-solid fa-xmark text-xs'></i>
          </button>
          
          <button class='absolute right-1.5 top-1/2 -translate-y-1/2 w-7 h-7 flex items-center justify-center rounded-lg bg-emerald-50 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 hover:bg-emerald-500 hover:text-white transition-all' onclick='openCameraScanner()' title='Scan Barcode Kamera'>
            <i class='fa-solid fa-qrcode text-xs'></i>
          </button>
        </div>

        <!-- Grid vs List View Toggle -->
        <div class='flex bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-0.5 shrink-0'>
          <button type='button' class='w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold transition-all text-emerald-600 dark:text-emerald-400 bg-white dark:bg-slate-900 shadow-sm' id='btn-pos-view-grid' onclick='setPosViewMode(&quot;grid&quot;)' title='Tampilan Grid'>
            <i class='fa-solid fa-border-all'></i>
          </button>
          <button type='button' class='w-8 h-8 rounded-lg flex items-center justify-center text-xs font-bold transition-all text-slate-400 hover:text-slate-700 dark:hover:text-slate-200' id='btn-pos-view-list' onclick='setPosViewMode(&quot;list&quot;)' title='Tampilan List'>
            <i class='fa-solid fa-list-ul'></i>
          </button>
        </div>
      </div>

      <!-- Category Horizontal Pills Bar -->
      <div class='flex items-center gap-2 overflow-x-auto hide-scrollbar py-0.5' id='pos-categories-container'></div>
    </div>

    <!-- Product List / Grid Canvas (Full Width Responsive) -->
    <div class='flex-1 min-h-0 overflow-y-auto p-2.5 sm:p-4 pb-28 custom-scrollbar' id='pos-products-scroll'>
      <div id='pos-product-container'></div>
    </div>

    <!-- ========================================================================= -->
    <!-- UNIVERSAL FLOATING CART DOCK (Visible on HP, Tablet & PC when items > 0)  -->
    <!-- ========================================================================= -->
    <div class='fixed bottom-4 left-3 right-3 sm:left-auto sm:right-6 sm:w-[400px] z-40 bg-slate-900/95 dark:bg-slate-800/95 backdrop-blur-md text-white p-3 rounded-2xl shadow-2xl border border-slate-700/80 flex items-center justify-between gap-3 transform translate-y-28 opacity-0 pointer-events-none transition-all duration-300' id='pos-floating-cart-dock'>
      <div class='flex items-center gap-2.5 min-w-0 cursor-pointer' onclick='openPosCartDrawer()'>
        <div class='w-10 h-10 rounded-xl flex items-center justify-center font-bold text-white shrink-0 shadow-md' style='background-color: var(--clr-p);'>
          <i class='fa-solid fa-cart-shopping text-sm'></i>
        </div>
        <div class='min-w-0'>
          <p class='text-[10px] text-slate-300 font-bold uppercase tracking-wider' id='pos-float-dock-count'>0 Item</p>
          <p class='text-sm sm:text-base font-black text-white truncate' id='pos-float-dock-total'>Rp 0</p>
        </div>
      </div>
      <div class='flex items-center gap-2 shrink-0'>
        <button type='button' class='btn-primary !py-2.5 !px-4 !text-xs !font-black !rounded-xl shadow-lg flex items-center gap-1.5' onclick='openPosCartDrawer()'>
          <span>Lihat Keranjang</span>
          <i class='fa-solid fa-arrow-right text-[10px]'></i>
        </button>
      </div>
    </div>

  </div>
</div>

<!-- ========================================================================= -->
<!-- UNIVERSAL FLOATING CART DRAWER (HP: Bottom Sheet / Tablet & PC: Right Side)-->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[75] bg-slate-900/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-stretch sm:justify-end' id='pos-cart-drawer-modal' onclick='if(event.target===this) closePosCartDrawer()'>
  <div class='w-full sm:w-[430px] sm:max-w-full max-h-[90dvh] sm:max-h-full h-auto sm:h-full bg-white dark:bg-slate-900 rounded-t-[2rem] sm:rounded-none shadow-2xl flex flex-col transform translate-y-full sm:translate-y-0 sm:translate-x-full transition-transform duration-300 overflow-hidden border-l border-slate-200 dark:border-slate-800' id='pos-cart-drawer-box'>
    
    <!-- Drawer Header -->
    <div class='px-5 py-3.5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between shrink-0 bg-slate-50 dark:bg-[#0b1329]'>
      <div class='flex items-center gap-2.5'>
        <div class='w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-xs font-bold'>
          <i class='fa-solid fa-receipt text-sm'></i>
        </div>
        <div>
          <h3 class='font-black text-sm text-slate-900 dark:text-white leading-tight'>Keranjang Transaksi</h3>
          <p class='text-[10px] text-slate-500 dark:text-slate-400 font-semibold' id='pos-drawer-cart-count'>0 Item</p>
        </div>
      </div>
      <div class='flex items-center gap-2'>
        <button type='button' class='text-xs font-bold text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 px-2.5 py-1.5 rounded-lg transition-colors flex items-center gap-1' onclick='clearPosCart()' title='Reset Transaksi'>
          <i class='fa-solid fa-trash-can text-[10px]'></i> Reset
        </button>
        <button type='button' class='w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-slate-800 dark:hover:text-white flex items-center justify-center text-xs transition-colors' onclick='closePosCartDrawer()' title='Tutup'>
          <i class='fa-solid fa-xmark text-sm'></i>
        </button>
      </div>
    </div>

    <!-- Drawer Item List -->
    <div class='flex-1 min-h-[180px] overflow-y-auto p-3.5 space-y-2.5 custom-scrollbar bg-slate-50/50 dark:bg-[#070c18]' id='pos-drawer-cart-items-container'></div>

    <!-- Drawer Summary & Payment Action Footer -->
    <div class='p-4 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 space-y-3 shrink-0 shadow-lg'>
      <div class='space-y-1.5 text-xs font-semibold bg-slate-50 dark:bg-[#0b1329] p-3 rounded-xl border border-slate-200 dark:border-slate-800'>
        <div class='flex justify-between text-slate-600 dark:text-slate-400'>
          <span>Subtotal</span>
          <span class='font-bold text-slate-900 dark:text-white' id='pos-drawer-summary-subtotal'>Rp 0</span>
        </div>
        <div class='flex justify-between text-slate-600 dark:text-slate-400'>
          <span>Diskon Grosir</span>
          <span class='font-bold text-emerald-600 dark:text-emerald-400' id='pos-drawer-summary-discount'>Rp 0</span>
        </div>
        <div class='pt-2 border-t border-slate-200 dark:border-slate-800 flex justify-between items-baseline'>
          <span class='text-xs font-black text-slate-800 dark:text-slate-200 uppercase tracking-wide'>Total Bayar</span>
          <span class='text-xl sm:text-2xl font-black text-emerald-600 dark:text-emerald-400' id='pos-drawer-summary-total'>Rp 0</span>
        </div>
      </div>

      <button class='btn-primary w-full !py-3.5 !text-sm !font-black shadow-xl hover:-translate-y-0.5 active:scale-95' onclick='closePosCartDrawer(); openPosPaymentModal();'>
        <i class='fa-solid fa-money-bill-wave mr-1.5'></i> Bayar Sekarang
      </button>
    </div>

  </div>
</div>

<!-- ========================================================================= -->
<!-- MODAL: QUICK VARIANT SELECTOR (PILIH VARIAN PRODUK POS)                   -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[78] bg-slate-900/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4' id='pos-variant-modal' onclick='if(event.target===this) closePosVariantModal()'>
  <div class='w-full max-w-md bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col transform scale-95 transition-transform duration-300' id='pos-variant-box'>
    <div class='px-5 py-3.5 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between'>
      <div class='flex items-center gap-2'>
        <i class='fa-solid fa-layer-group text-emerald-600 dark:text-emerald-400 text-sm'></i>
        <h3 class='font-black text-xs sm:text-sm text-slate-900 dark:text-white'>Pilih Varian Produk</h3>
      </div>
      <button type='button' class='w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-rose-500 flex items-center justify-center text-xs' onclick='closePosVariantModal()'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>
    <div class='p-4 space-y-3 max-h-[60vh] overflow-y-auto custom-scrollbar'>
      <div class='flex items-center gap-3 p-2.5 bg-slate-50 dark:bg-[#0b1329] rounded-xl border border-slate-200/80 dark:border-slate-800'>
        <img src='' id='pos-variant-prod-img' class='w-12 h-12 object-cover rounded-lg shrink-0 border border-slate-200 dark:border-slate-700'/>
        <div class='min-w-0'>
          <h4 class='text-xs font-bold text-slate-900 dark:text-white truncate' id='pos-variant-prod-name'>Nama Produk</h4>
          <p class='text-[10px] text-slate-500 font-semibold' id='pos-variant-prod-sku'>SKU: -</p>
        </div>
      </div>
      <div class='space-y-1.5' id='pos-variant-options-list'></div>
    </div>
  </div>
</div>

<!-- ========================================================================= -->
<!-- MODAL: EDIT DECIMAL QUANTITY (SATUAN DESIMAL / BERAT)                     -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[79] bg-slate-900/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4' id='pos-qty-modal' onclick='if(event.target===this) closePosQtyModal()'>
  <div class='w-full max-w-sm bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col transform scale-95 transition-transform duration-300' id='pos-qty-box'>
    <div class='px-5 py-3.5 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between'>
      <h3 class='font-black text-xs sm:text-sm text-slate-900 dark:text-white' id='pos-qty-modal-title'>Ubah Jumlah Beli</h3>
      <button type='button' class='w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-rose-500 flex items-center justify-center text-xs' onclick='closePosQtyModal()'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>
    <div class='p-5 space-y-3.5 text-center'>
      <p class='text-xs text-slate-500 dark:text-slate-400 font-medium' id='pos-qty-prod-name'>Nama Produk</p>
      <div class='relative max-w-[200px] mx-auto'>
        <input type='number' step='0.01' min='0.01' id='pos-qty-modal-input' class='w-full text-center text-2xl font-black px-4 py-2.5 bg-slate-50 dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white'/>
        <span class='absolute right-3 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400' id='pos-qty-modal-unit'>PCS</span>
      </div>
      <!-- Quick Decimal Presets (0.25, 0.5, 1, 2, 5) -->
      <div class='flex justify-center gap-1.5 flex-wrap'>
        <button type='button' class='px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-bold' onclick='setPosQtyPreset(0.25)'>0.25</button>
        <button type='button' class='px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-bold' onclick='setPosQtyPreset(0.5)'>0.5</button>
        <button type='button' class='px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-bold' onclick='setPosQtyPreset(1)'>1</button>
        <button type='button' class='px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-bold' onclick='setPosQtyPreset(2)'>2</button>
        <button type='button' class='px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 rounded-lg text-xs font-bold' onclick='setPosQtyPreset(5)'>5</button>
      </div>
      <button type='button' class='btn-primary w-full !py-2.5 !text-xs !font-bold mt-2' onclick='savePosQtyModal()'>
        Simpan Jumlah
      </button>
    </div>
  </div>
</div>

<!-- ========================================================================= -->
<!-- MODAL: POS QUICK PAYMENT (PEMBAYARAN KILAT KASIR)                         -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[80] bg-slate-900/70 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-3 sm:p-5' id='pos-payment-modal' onclick='if(event.target===this) closePosPaymentModal()'>
  <div class='w-full max-w-lg bg-white dark:bg-slate-900 rounded-[2rem] shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden flex flex-col transform scale-95 transition-transform duration-300' id='pos-payment-box'>
    
    <!-- Modal Header -->
    <div class='px-5 sm:px-6 py-3.5 sm:py-4 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between'>
      <div class='flex items-center gap-2.5'>
        <div class='w-8 h-8 rounded-xl bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-sm font-bold'>
          <i class='fa-solid fa-wallet'></i>
        </div>
        <div>
          <h3 class='font-black text-xs sm:text-sm text-slate-900 dark:text-white leading-tight'>Pembayaran Kasir</h3>
          <p class='text-[10px] text-slate-500 dark:text-slate-400 font-semibold'>Selesaikan transaksi belanja</p>
        </div>
      </div>
      <button class='w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 flex items-center justify-center text-xs transition-colors' onclick='closePosPaymentModal()'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>

    <!-- Modal Content -->
    <div class='p-4 sm:p-6 space-y-3.5 max-h-[75vh] overflow-y-auto custom-scrollbar'>
      <!-- Total Tagihan -->
      <div class='bg-emerald-50 dark:bg-emerald-950/40 p-3 sm:p-4 rounded-2xl border border-emerald-200 dark:border-emerald-800/60 text-center'>
        <p class='text-[10px] font-bold text-emerald-800 dark:text-emerald-400 uppercase tracking-widest mb-0.5'>Total Tagihan</p>
        <h2 class='text-2xl sm:text-3xl font-black text-emerald-600 dark:text-emerald-400' id='pos-modal-total-display'>Rp 0</h2>
      </div>

      <!-- Pilihan Metode Pembayaran -->
      <div>
        <label class='text-[10px] sm:text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1.5 block uppercase tracking-wider'>Metode Pembayaran</label>
        <div class='grid grid-cols-2 sm:grid-cols-4 gap-1.5 sm:gap-2' id='pos-payment-method-selector'>
          <button type='button' class='p-2 sm:p-2.5 rounded-xl border-2 font-bold text-xs flex flex-col items-center gap-1 transition-all pos-method-btn active-method border-emerald-500 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-700 dark:text-emerald-300' data-method='cash' onclick='setPosPaymentMethod(&quot;cash&quot;)'>
            <i class='fa-solid fa-money-bill-wave text-sm text-emerald-600'></i>
            <span>Tunai</span>
          </button>
          <button type='button' class='p-2 sm:p-2.5 rounded-xl border-2 font-bold text-xs flex flex-col items-center gap-1 transition-all pos-method-btn border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:border-slate-300' data-method='qris' onclick='setPosPaymentMethod(&quot;qris&quot;)'>
            <i class='fa-solid fa-qrcode text-sm text-slate-500'></i>
            <span>QRIS</span>
          </button>
          <button type='button' class='p-2 sm:p-2.5 rounded-xl border-2 font-bold text-xs flex flex-col items-center gap-1 transition-all pos-method-btn border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:border-slate-300' data-method='transfer' onclick='setPosPaymentMethod(&quot;transfer&quot;)'>
            <i class='fa-solid fa-building-columns text-sm text-slate-500'></i>
            <span>Transfer</span>
          </button>
          <button type='button' class='p-2 sm:p-2.5 rounded-xl border-2 font-bold text-xs flex flex-col items-center gap-1 transition-all pos-method-btn border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-300 hover:border-slate-300' data-method='edc' onclick='setPosPaymentMethod(&quot;edc&quot;)'>
            <i class='fa-solid fa-credit-card text-sm text-slate-500'></i>
            <span>Debit/EDC</span>
          </button>
        </div>
      </div>

      <!-- Section Khusus Tunai (Input Cash & Kembalian) -->
      <div id='pos-cash-input-section' class='space-y-2.5 pt-1'>
        <div>
          <label class='text-[10px] sm:text-[11px] font-bold text-slate-700 dark:text-slate-300 mb-1 block uppercase tracking-wider'>Uang Diterima (Rp)</label>
          <input type='number' id='pos-cash-received-input' class='w-full text-base sm:text-xl font-black px-3.5 py-2.5 sm:py-3 bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 rounded-xl focus:outline-none focus:border-emerald-500 text-slate-900 dark:text-white' placeholder='0' oninput='calculatePosChange()'/>
        </div>

        <!-- Quick Cash Buttons -->
        <div class='flex flex-wrap gap-1.5' id='pos-quick-cash-buttons'>
          <button type='button' class='px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-[11px] font-bold text-slate-700 dark:text-slate-200 transition-colors' onclick='setQuickCash(&quot;exact&quot;)'>Uang Pas</button>
          <button type='button' class='px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 rounded-lg text-[11px] font-bold text-slate-700 dark:text-slate-200 transition-colors' onclick='setQuickCash(10000)'>10.000</button>
