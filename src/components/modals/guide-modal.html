<!-- ========================================================================= -->
<!-- MODAL: BUKU PANDUAN & TUTORIAL CEPAT CMS & POS KASIR                      -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[105] bg-slate-900/70 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 md:p-6 opacity-0 transition-opacity duration-300' id='cms-guide-modal' onclick='if(event.target===this) closeCmsGuide()'>
  <div class='bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-full sm:max-w-2xl md:max-w-3xl lg:max-w-4xl max-h-[92dvh] sm:max-h-[88dvh] flex flex-col hide-scrollbar shadow-2xl border border-slate-200/80 dark:border-slate-700/80 relative transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-300 overflow-hidden' id='cms-guide-modal-box'>
    
    <!-- Mobile Grab Bar Handle -->
    <div class='w-full pt-2.5 pb-1 flex justify-center sm:hidden shrink-0 bg-white dark:bg-slate-800'>
      <div class='w-12 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600'></div>
    </div>

    <!-- Modal Header -->
    <div class='sticky top-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-sm px-4 sm:px-6 py-3.5 border-b border-slate-100 dark:border-slate-700/80 flex justify-between items-center z-20 shrink-0'>
      <div class='flex items-center gap-3 min-w-0'>
        <div class='w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0 shadow-sm' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
          <i class='fa-solid fa-book-open-reader'></i>
        </div>
        <div class='min-w-0'>
          <h3 class='font-bold text-slate-900 dark:text-white text-sm sm:text-base tracking-tight truncate'>Pusat Panduan CMS & POS Kasir</h3>
          <p class='text-[10px] sm:text-xs font-semibold text-slate-400 truncate'>Panduan lengkap kelola produk, varian, HPP, kasir & laporan laba</p>
        </div>
      </div>
      <button class='w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 dark:hover:text-rose-400 transition-all border border-slate-200 dark:border-slate-600 shrink-0 ml-2' onclick='closeCmsGuide()' title='Tutup'>
        <i class='fa-solid fa-xmark text-sm'></i>
      </button>
    </div>

    <!-- Topic Navigation Pills -->
    <div class='bg-slate-50 dark:bg-slate-900/70 px-3 sm:px-5 py-2 border-b border-slate-100 dark:border-slate-700/80 overflow-x-auto no-scrollbar flex items-center gap-1.5 sm:gap-2 shrink-0'>
      <button type='button' onclick='showGuideTopic("products")' id='guide-btn-products' class='guide-topic-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-box-open'></i> <span>Produk & HPP</span>
      </button>
      <button type='button' onclick='showGuideTopic("variants")' id='guide-btn-variants' class='guide-topic-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-layer-group'></i> <span>Multi-Varian & Grosir</span>
      </button>
      <button type='button' onclick='showGuideTopic("pos")' id='guide-btn-pos' class='guide-topic-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-cash-register'></i> <span>POS Kasir</span>
      </button>
      <button type='button' onclick='showGuideTopic("reports")' id='guide-btn-reports' class='guide-topic-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-chart-line'></i> <span>Laporan Laba</span>
      </button>
      <button type='button' onclick='showGuideTopic("orders")' id='guide-btn-orders' class='guide-topic-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-receipt'></i> <span>Pesanan Online</span>
      </button>
      <button type='button' onclick='showGuideTopic("settings")' id='guide-btn-settings' class='guide-topic-btn px-3 py-1.5 rounded-xl text-xs font-bold transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-gear'></i> <span>Pengaturan & Kasir</span>
      </button>
    </div>

    <!-- Guide Content Area -->
    <div class='p-4 sm:p-6 overflow-y-auto flex-1 text-slate-700 dark:text-slate-200' id='cms-guide-content'>
      <!-- Content populated dynamically by JavaScript -->
    </div>

    <!-- Footer Modal -->
    <div class='p-3.5 sm:p-4 bg-slate-50 dark:bg-slate-900/80 border-t border-slate-100 dark:border-slate-700/80 flex items-center justify-between gap-3 shrink-0'>
      <span class='text-[10px] sm:text-xs text-slate-400 font-medium flex items-center gap-1.5 truncate'>
        <i class='fa-solid fa-lightbulb text-amber-400'></i> Tips: Buka panduan ini kapan saja dari tombol Bantuan.
      </span>
      <button type='button' onclick='closeCmsGuide()' class='px-4 py-2 text-white rounded-xl text-xs font-bold transition-all shadow-sm shrink-0 active:scale-95' style='background-color:var(--clr-p)'>
        Tutup Panduan
      </button>
    </div>

  </div>
</div>
