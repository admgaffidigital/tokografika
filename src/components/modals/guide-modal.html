<!-- ========================================================================= -->
<!-- MODAL: BUKU PANDUAN & TUTORIAL CEPAT CMS & POS KASIR                      -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[105] bg-slate-900/70 hidden flex items-center justify-center p-3 sm:p-6 opacity-0 transition-opacity duration-300' id='cms-guide-modal' onclick='if(event.target===this) closeCmsGuide()'>
  <div class='bg-white dark:bg-slate-800 rounded-2xl w-full max-w-2xl sm:max-w-3xl md:max-w-4xl max-h-[92dvh] flex flex-col hide-scrollbar shadow-2xl border border-slate-200/80 dark:border-slate-700/80 relative transform scale-95 transition-transform duration-300 overflow-hidden' id='cms-guide-modal-box'>
    
    <!-- Modal Header -->
    <div class='sticky top-0 bg-white dark:bg-slate-800 px-5 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center z-20 shrink-0'>
      <div class='flex items-center gap-3'>
        <div class='w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
          <i class='fa-solid fa-book-open-reader'></i>
        </div>
        <div>
          <h3 class='font-black text-slate-900 dark:text-white text-base tracking-tight'>Pusat Panduan & Tutorial CMS</h3>
          <p class='text-[10px] sm:text-xs font-semibold text-slate-400'>Pelajari cara cepat memaksimalkan seluruh fitur toko & kasir Anda</p>
        </div>
      </div>
      <button class='w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 dark:hover:text-rose-400 transition-all border border-slate-200 dark:border-slate-600' onclick='closeCmsGuide()' title='Tutup'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>

    <!-- Topic Navigation Pills -->
    <div class='bg-slate-50 dark:bg-slate-900/60 px-4 py-2.5 border-b border-slate-200 dark:border-slate-700/80 overflow-x-auto no-scrollbar flex items-center gap-2 shrink-0'>
      <button type='button' onclick='showGuideTopic("products")' id='guide-btn-products' class='guide-topic-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-box-open text-emerald-500'></i> <span>Upload & HPP Produk</span>
      </button>
      <button type='button' onclick='showGuideTopic("variants")' id='guide-btn-variants' class='guide-topic-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-layer-group text-blue-500'></i> <span>Multi-Varian & Grosir</span>
      </button>
      <button type='button' onclick='showGuideTopic("pos")' id='guide-btn-pos' class='guide-topic-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-cash-register text-purple-500'></i> <span>Transaksi POS Kasir</span>
      </button>
      <button type='button' onclick='showGuideTopic("reports")' id='guide-btn-reports' class='guide-topic-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-chart-line text-amber-500'></i> <span>Laporan Laba Rugi</span>
      </button>
      <button type='button' onclick='showGuideTopic("orders")' id='guide-btn-orders' class='guide-topic-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-receipt text-indigo-500'></i> <span>Pesanan Online</span>
      </button>
      <button type='button' onclick='showGuideTopic("settings")' id='guide-btn-settings' class='guide-topic-btn px-3 py-1.5 rounded-lg text-xs font-black transition-all shrink-0 flex items-center gap-1.5'>
        <i class='fa-solid fa-gear text-slate-500'></i> <span>Pengaturan & Kasir</span>
      </button>
    </div>

    <!-- Guide Content Area -->
    <div class='p-5 sm:p-6 overflow-y-auto flex-1 space-y-6 text-slate-700 dark:text-slate-200' id='cms-guide-content'>
      <!-- Content populated dynamically by JavaScript -->
    </div>

    <!-- Footer Modal -->
    <div class='p-4 bg-slate-50 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 flex items-center justify-between gap-3 shrink-0'>
      <span class='text-[10px] text-slate-400 font-bold flex items-center gap-1'>
        <i class='fa-solid fa-lightbulb text-amber-400'></i> Tips: Panduan ini bisa dibuka kapan saja dari tombol Bantuan.
      </span>
      <button type='button' onclick='closeCmsGuide()' class='px-4 py-2 bg-slate-800 dark:bg-slate-700 hover:bg-slate-900 text-white rounded-xl text-xs font-bold transition-all shadow-sm'>
        Tutup Panduan
      </button>
    </div>

  </div>
</div>
