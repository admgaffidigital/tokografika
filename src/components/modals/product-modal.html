<!-- ========================================================================= -->
<!-- MODAL: PRODUCT DETAIL & ADD TO CART                                       -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[70] bg-slate-900/70 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center p-0 sm:p-5' id='product-modal' onclick='if(event.target===this) closeProductModal()'>
  <div class='w-full max-w-md sm:max-w-lg md:max-w-xl bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl max-h-[90dvh] sm:max-h-[88dvh] overflow-y-auto transform translate-y-full sm:translate-y-0 transition-transform duration-300 hide-scrollbar shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col relative' id='product-modal-content'>
    <div class='sticky top-0 right-0 left-0 z-30 flex justify-end gap-2 p-3 pointer-events-none'>
      <button class='w-9 h-9 flex items-center justify-center rounded-full bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 hover:bg-emerald-500 hover:text-white transition-all border border-slate-200 dark:border-slate-700 shadow-md pointer-events-auto' onclick='shareProduct()' title='Bagikan'>
        <i class='fa-solid fa-share-nodes text-sm'></i>
      </button>
      <button class='w-9 h-9 flex items-center justify-center rounded-full bg-white dark:bg-slate-900 text-slate-700 dark:text-slate-200 hover:bg-rose-500 hover:text-white transition-all border border-slate-200 dark:border-slate-700 shadow-md pointer-events-auto' onclick='closeProductModal()' title='Tutup'>
        <i class='fa-solid fa-xmark text-sm'></i>
      </button>
    </div>
    <div class='w-full aspect-square bg-slate-100 dark:bg-slate-900 -mt-15 relative overflow-hidden sm:rounded-t-2xl shrink-0 border-b border-slate-200 dark:border-slate-700'>
      <img class='w-full h-full object-cover transition-opacity duration-300' id='product-modal-img' src=''/>
    </div>
    <div class='p-5 sm:p-6 bg-white dark:bg-slate-800 flex-1 flex flex-col'>
      <div class='mb-2 flex flex-wrap gap-1.5' id='product-modal-badges'></div>
      <h3 class='text-lg sm:text-xl font-bold text-slate-900 dark:text-white mb-1.5 leading-snug' id='product-modal-title'>Nama Produk</h3>
      <p class='text-emerald-600 dark:text-emerald-400 font-bold text-xl sm:text-2xl mb-4' id='product-modal-price'>Rp 0</p>
      <div class='bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700 mb-5'>
        <p class='text-xs sm:text-sm text-slate-600 dark:text-slate-300 font-medium leading-relaxed whitespace-pre-wrap' id='product-modal-desc'>Deskripsi Produk</p>
      </div>
      <div id='product-modal-wholesale-container'></div>
      <div class='mb-5 hidden' id='product-modal-options-container'>
        <div class='flex items-center justify-between mb-2.5'>
          <span class='text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider'>Pilih Varian</span>
        </div>
        <div class='flex flex-wrap gap-2' id='product-modal-options'></div>
      </div>
      <div class='pt-4 mt-auto border-t border-slate-200 dark:border-slate-700 pb-4'>
        <div class='space-y-4' id='modal-active-controls'>
          <div class='flex items-center justify-between'>
            <span class='text-sm font-bold text-slate-700 dark:text-slate-300'>Jumlah</span>
            <div class='flex items-center bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl h-10 overflow-hidden'>
              <button class='w-10 h-full flex items-center justify-center text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold' onclick='updateModalQty(-1)'><i class='fa-solid fa-minus text-xs'></i></button>
              <input class='w-12 text-center text-sm font-semibold text-slate-900 dark:text-white bg-transparent focus:outline-none' id='modal-qty-input' min='1' onchange='handleModalQtyChange(this.value)' step='1' type='number' value='1'/>
              <button class='w-10 h-full flex items-center justify-center text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold' onclick='updateModalQty(1)'><i class='fa-solid fa-plus text-xs'></i></button>
            </div>
          </div>
          <div class='flex items-center justify-between bg-emerald-50 dark:bg-emerald-950/40 p-3.5 rounded-xl border border-emerald-200 dark:border-emerald-800/60'>
            <span class='text-xs font-bold text-emerald-800 dark:text-emerald-400 uppercase tracking-wider'>Subtotal</span>
            <span class='text-lg font-bold text-emerald-700 dark:text-emerald-300' id='btn-modal-price-preview'>Rp 0</span>
          </div>
          <div class='flex gap-2.5 h-12'>
            <button class='w-12 shrink-0 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 rounded-xl flex items-center justify-center hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 dark:hover:text-rose-400 transition-all shadow-sm' onclick='confirmAddToWishlist()' title='Wishlist'>
              <i class='fa-regular fa-heart text-lg'></i>
            </button>
            <button class='btn-primary flex-1 !rounded-xl text-sm' onclick='confirmAddProductToCart()'>
              <i class='fa-solid fa-cart-plus mr-1'></i> Masuk Keranjang
            </button>
          </div>
        </div>
        <div class='hidden bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800/50 p-4 rounded-xl text-center text-rose-600 dark:text-rose-400 font-bold text-sm' id='modal-inactive-controls'>
          <i class='fa-solid fa-box-open mr-1'></i> Stok Sedang Kosong
        </div>
      </div>
    </div>
  </div>
</div>
