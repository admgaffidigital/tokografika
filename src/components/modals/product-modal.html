<!-- ========================================================================= -->
<!-- MODAL: PRODUCT DETAIL & ADD TO CART                                       -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[70] bg-slate-900/70 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center p-0 sm:p-5' id='product-modal' onclick='if(event.target===this) closeProductModal()'>
  <div class='w-full max-w-md sm:max-w-lg md:max-w-xl bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl max-h-[90dvh] sm:max-h-[88dvh] overflow-y-auto transform translate-y-full sm:translate-y-0 transition-transform duration-300 hide-scrollbar shadow-2xl border border-slate-200 dark:border-slate-700 flex flex-col relative' id='product-modal-content'>
    <!-- Synchronized Glass Theme Header -->
    <div class='glass-header sticky top-0 right-0 left-0 z-30 px-3.5 sm:px-5 py-2.5 sm:py-3 flex items-center justify-between shadow-md shrink-0 sm:rounded-t-2xl' style='background-color:var(--clr-p)!important;'>
      <div class='flex items-center gap-2 min-w-0 flex-1 text-white'>
        <div class='w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-white/20 flex items-center justify-center text-white shrink-0 border border-white/30 backdrop-blur-sm'>
          <i class='fa-solid fa-box-open text-xs sm:text-sm text-white'></i>
        </div>
        <span class='text-xs sm:text-sm font-bold text-white tracking-tight truncate'>Detail Produk</span>
      </div>
      <div class='flex items-center gap-2 shrink-0'>
        <button class='w-8 h-8 sm:w-8.5 sm:h-8.5 flex items-center justify-center rounded-full bg-white/20 hover:bg-white/30 text-white transition-all border border-white/30 shadow-sm backdrop-blur-sm active:scale-95' onclick='shareProduct()' title='Bagikan Produk'>
          <i class='fa-solid fa-share-nodes text-xs sm:text-sm text-white'></i>
        </button>
        <button class='w-8 h-8 sm:w-8.5 sm:h-8.5 flex items-center justify-center rounded-full bg-white/20 hover:bg-rose-600/90 text-white transition-all border border-white/30 shadow-sm backdrop-blur-sm active:scale-95' onclick='closeProductModal()' title='Tutup'>
          <i class='fa-solid fa-xmark text-xs sm:text-sm text-white'></i>
        </button>
      </div>
    </div>

    <!-- Product Image Container -->
    <div class='w-full aspect-square bg-slate-100 dark:bg-slate-900 relative overflow-hidden shrink-0 border-b border-slate-200 dark:border-slate-700'>
      <img class='w-full h-full object-cover transition-opacity duration-300' id='product-modal-img' src='' alt='Foto Produk'/>
    </div>
    <div class='p-5 sm:p-6 bg-white dark:bg-slate-800 flex-1 flex flex-col'>
      <div class='mb-2 flex flex-wrap gap-1.5' id='product-modal-badges'></div>
      <h3 class='text-lg sm:text-xl font-bold text-slate-900 dark:text-white mb-1.5 leading-snug' id='product-modal-title'>Nama Produk</h3>
      <p class='text-emerald-600 dark:text-emerald-400 font-bold text-xl sm:text-2xl mb-4' id='product-modal-price'>Rp 0</p>
      <div class='bg-slate-50 dark:bg-slate-900 p-4 rounded-xl border border-slate-200 dark:border-slate-700 mb-5'>
        <p class='text-xs sm:text-sm text-slate-600 dark:text-slate-300 font-medium leading-relaxed whitespace-pre-wrap' id='product-modal-desc'>Deskripsi Produk</p>
      </div>
      <div id='product-modal-wholesale-container'></div>
      
      <!-- Buyer Quick Tip in Modal -->
      <div class='flex items-center justify-between py-2 px-3 rounded-xl border mb-4 text-xs' style='background-color:var(--clr-p-bg);border-color:rgba(0,0,0,0.06)'>
        <span class='text-[10px] sm:text-[11px] font-semibold text-slate-700 dark:text-slate-300 flex items-center gap-1.5'>
          <i class='fa-solid fa-lightbulb text-amber-500'></i> Panduan Varian, Grosir & Desimal
        </span>
        <button type='button' onclick='openBuyerGuide("variants")' class='text-[10px] sm:text-[11px] font-bold hover:underline flex items-center gap-1 shrink-0' style='color:var(--clr-p)'>
          <span>Panduan</span> <i class='fa-solid fa-chevron-right text-[8px]'></i>
        </button>
      </div>

      <div class='mb-5 hidden' id='product-modal-options-container'>
        <div class='flex items-center justify-between mb-2.5'>
          <span class='text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider'>Pilih Varian</span>
          <button type='button' onclick='openBuyerGuide("variants")' class='text-[10px] font-bold hover:underline' style='color:var(--clr-p)'>Bantuan Varian</button>
        </div>
        <div class='flex flex-wrap gap-2' id='product-modal-options'></div>
      </div>
      <div class='pt-4 mt-auto border-t border-slate-200 dark:border-slate-700 pb-4'>
        <div class='space-y-4' id='modal-active-controls'>
          <div class='flex items-center justify-between'>
            <div>
              <span class='text-sm font-bold text-slate-700 dark:text-slate-300'>Jumlah</span>
              <p class='text-[9px] text-slate-400'>Bisa ketik desimal (cth: 0.5)</p>
            </div>
            <div class='flex items-center bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl h-10 overflow-hidden'>
              <button class='w-10 h-full flex items-center justify-center text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold' onclick='updateModalQty(-1)'><i class='fa-solid fa-minus text-xs'></i></button>
              <input class='w-16 text-center text-sm font-semibold text-slate-900 dark:text-white bg-transparent focus:outline-none' id='modal-qty-input' min='0.01' onchange='handleModalQtyChange(this.value)' step='any' type='number' value='1'/>
              <button class='w-10 h-full flex items-center justify-center text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-700 font-bold' onclick='updateModalQty(1)'><i class='fa-solid fa-plus text-xs'></i></button>
            </div>
          </div>
          <div class='flex items-center justify-between p-3.5 rounded-xl border' style='background-color:var(--clr-p-bg);border-color:rgba(0,0,0,0.06)'>
            <span class='text-xs font-bold uppercase tracking-wider' style='color:var(--clr-p)'>Subtotal</span>
            <span class='text-lg font-bold' style='color:var(--clr-p)' id='btn-modal-price-preview'>Rp 0</span>
          </div>
          <div class='flex gap-2.5 h-12'>
            <button class='w-12 shrink-0 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 rounded-xl flex items-center justify-center hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 dark:hover:text-rose-400 transition-all shadow-sm' onclick='confirmAddToWishlist()' title='Wishlist'>
              <i class='fa-regular fa-heart text-lg'></i>
            </button>
            <button class='w-12 shrink-0 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 rounded-xl flex items-center justify-center hover:bg-emerald-50 dark:hover:bg-emerald-900/30 hover:text-emerald-500 dark:hover:text-emerald-400 transition-all shadow-sm' onclick='shareProduct()' title='Bagikan Produk'>
              <i class='fa-solid fa-share-nodes text-lg'></i>
            </button>
            <button class='btn-primary flex-1 !rounded-xl text-sm' onclick='confirmAddProductToCart()'>
              <i class='fa-solid fa-cart-plus mr-1'></i> Masuk Keranjang
            </button>
          </div>
        </div>
        <div class='hidden bg-rose-50 dark:bg-rose-900/30 border border-rose-200 dark:border-rose-800/50 p-4 rounded-xl text-center text-rose-600 dark:text-rose-400 font-bold text-sm' id='modal-inactive-controls'>
          <i class='fa-solid fa-box-open mr-1'></i> Stok Sedang Kosong
        </div>
      </div>
    </div>
  </div>
</div>
