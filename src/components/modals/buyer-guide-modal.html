<!-- ========================================================================= -->
<!-- MODAL: BUKU PANDUAN BELANJA & CARA PESAN ONLINE (STOREFRONT)             -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[105] bg-slate-900/70 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 md:p-6 opacity-0 transition-opacity duration-300' id='buyer-guide-modal' onclick='if(event.target===this) closeBuyerGuide()'>
  <div class='bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-full sm:max-w-2xl md:max-w-3xl lg:max-w-4xl max-h-[92dvh] sm:max-h-[88dvh] flex flex-col hide-scrollbar shadow-2xl border border-slate-200/80 dark:border-slate-700/80 relative transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-300 overflow-hidden' id='buyer-guide-modal-box'>
    
    <!-- Mobile Grab Bar Handle -->
    <div class='w-full pt-2.5 pb-1 flex justify-center sm:hidden shrink-0 bg-white dark:bg-slate-800'>
      <div class='w-12 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600'></div>
    </div>

    <!-- Modal Header (Synchronized Theme Header) -->
    <div class='glass-header sticky top-0 px-4 sm:px-6 py-3.5 flex justify-between items-center z-20 shrink-0 shadow-md' style='background-color:var(--clr-p)!important;'>
      <div class='flex items-center gap-3 min-w-0'>
        <div class='w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0 shadow-sm bg-white/20 text-white border border-white/30 backdrop-blur-sm'>
          <i class='fa-solid fa-book-open text-white'></i>
        </div>
        <div class='min-w-0'>
          <h3 class='font-bold text-white text-sm sm:text-base tracking-tight truncate'>Panduan Belanja & Cara Pesan</h3>
          <p class='text-[10px] sm:text-xs font-medium text-white/85 truncate'>Bantuan cara memesan, multi-varian, grosir & pembayaran</p>
        </div>
      </div>
      <button class='w-8 h-8 flex items-center justify-center rounded-full bg-white/20 hover:bg-rose-600/90 text-white transition-all border border-white/30 shadow-sm backdrop-blur-sm shrink-0 ml-2 active:scale-95' onclick='closeBuyerGuide()' title='Tutup'>
        <i class='fa-solid fa-xmark text-sm text-white'></i>
      </button>
    </div>

    <!-- Topic Navigation Pills -->
    <div class='bg-slate-50 dark:bg-slate-900/70 px-3 sm:px-6 py-2.5 border-b border-slate-100 dark:border-slate-700/80 overflow-x-auto hide-scrollbar no-scrollbar flex items-center gap-2 sm:gap-2.5 shrink-0'>
      <button type='button' onclick='showBuyerGuideTopic("order_flow")' id='bguide-btn-order_flow' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-cart-shopping text-[11px]'></i> <span>Cara Pesan</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("stock_info")' id='bguide-btn-stock_info' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-box-open text-[11px]'></i> <span>Stok & Ketersediaan</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("variants")' id='bguide-btn-variants' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-layer-group text-[11px]'></i> <span>Multi-Varian</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("wholesale")' id='bguide-btn-wholesale' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-tags text-[11px]'></i> <span>Harga Grosir</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("decimal")' id='bguide-btn-decimal' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-scale-balanced text-[11px]'></i> <span>Qty Koma / Kiloan</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("voucher")' id='bguide-btn-voucher' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-ticket text-[11px]'></i> <span>Voucher Promo</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("shipping")' id='bguide-btn-shipping' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-motorcycle text-[11px]'></i> <span>Pengiriman & GPS</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("payment")' id='bguide-btn-payment' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-wallet text-[11px]'></i> <span>Pembayaran</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("tracking")' id='bguide-btn-tracking' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-headset text-[11px]'></i> <span>Bantuan CS</span>
      </button>
      <button type='button' onclick='showBuyerGuideTopic("pwa_install")' id='bguide-btn-pwa_install' class='bguide-topic-btn px-3.5 py-2 rounded-full text-xs font-bold transition-all shrink-0 flex items-center gap-1.5 border border-slate-200/80 dark:border-slate-700 shadow-xs'>
        <i class='fa-solid fa-mobile-screen-button text-[11px] text-purple-500'></i> <span>Install Aplikasi HP</span>
      </button>
    </div>

    <!-- Guide Content Area -->
    <div class='p-4 sm:p-6 overflow-y-auto flex-1 text-slate-700 dark:text-slate-200' id='buyer-guide-content'>
      <!-- Content populated dynamically by JavaScript -->
    </div>

    <!-- Footer Modal -->
    <div class='p-3.5 sm:p-4 bg-slate-50 dark:bg-slate-900/80 border-t border-slate-100 dark:border-slate-700/80 flex items-center justify-between gap-3 shrink-0'>
      <span class='text-[10px] sm:text-xs text-slate-400 font-medium flex items-center gap-1.5 truncate'>
        <i class='fa-solid fa-circle-check text-emerald-500'></i> Transaksi mudah & aman langsung ke toko.
      </span>
      <button type='button' onclick='closeBuyerGuide()' class='px-4 py-2 text-white rounded-xl text-xs font-bold transition-all shadow-sm shrink-0 active:scale-95' style='background-color:var(--clr-p)'>
        Tutup Panduan
      </button>
    </div>

  </div>
</div>
