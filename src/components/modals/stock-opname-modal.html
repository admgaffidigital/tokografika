<!-- ========================================================================= -->
<!-- MODAL: INPUT STOK OPNAME (PENYESUAIAN STOK FISIK & AUDIT SELISIH)         -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[110] bg-slate-900/70 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 transition-opacity duration-300' id='stock-opname-modal' onclick='if(event.target===this) closeStockOpnameModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-full sm:max-w-lg md:max-w-xl lg:max-w-2xl xl:max-w-3xl max-h-[92dvh] sm:max-h-[88dvh] flex flex-col hide-scrollbar no-scrollbar shadow-2xl border border-slate-200/80 dark:border-slate-700/80 relative transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-300 overflow-hidden' id='stock-opname-modal-box'>
    
    <!-- Mobile Grab Bar Handle -->
    <div class='w-full pt-2.5 pb-1 flex justify-center sm:hidden shrink-0 bg-white dark:bg-slate-800'>
      <div class='w-12 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600'></div>
    </div>

    <!-- Modal Header -->
    <div class='sticky top-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-sm px-4 sm:px-6 py-3.5 border-b border-slate-100 dark:border-slate-700/80 flex justify-between items-center z-20 shrink-0'>
      <div class='flex items-center gap-3 min-w-0'>
        <div class='w-10 h-10 rounded-xl bg-cyan-50 dark:bg-cyan-900/30 text-cyan-600 dark:text-cyan-400 flex items-center justify-center text-lg shrink-0 shadow-sm border border-cyan-200/60 dark:border-cyan-800/50'>
          <i class='fa-solid fa-clipboard-check'></i>
        </div>
        <div class='min-w-0'>
          <h3 class='font-bold text-slate-900 dark:text-white text-sm sm:text-base tracking-tight truncate'>Catat Stok Opname</h3>
          <p class='text-[10px] sm:text-xs font-semibold text-slate-400 truncate'>Hitung fisik & audit selisih stok toko</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5 shrink-0 ml-2">
        <button type="button" class="w-8 h-8 flex items-center justify-center rounded-full bg-cyan-50 dark:bg-cyan-950/50 text-cyan-600 dark:text-cyan-400 hover:bg-cyan-100 dark:hover:bg-cyan-900/50 transition-all border border-cyan-200 dark:border-cyan-800 active:scale-95 text-xs" onclick='openCmsGuide("stock_opname")' title='Buku Panduan Stok Opname'>
          <i class="fa-solid fa-circle-question text-amber-500"></i>
        </button>
        <button class='w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 dark:hover:text-rose-400 transition-all border border-slate-200 dark:border-slate-600 active:scale-95' onclick='closeStockOpnameModal()' title='Tutup'>
          <i class='fa-solid fa-xmark text-sm'></i>
        </button>
      </div>
    </div>

    <!-- Modal Form Body -->
    <div class='p-4 sm:p-6 overflow-y-auto flex-1 text-slate-700 dark:text-slate-200 space-y-4' id='stock-opname-modal-body'>
      
      <!-- 1. Pilih Produk & Barcode Scan -->
      <div class="space-y-2">
        <label class='text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider block'>
          Pilih Produk / Cari & Scan Barcode
        </label>
        <div class="relative w-full">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="so-search-keyword" placeholder="Ketik nama produk, SKU, atau scan barcode..." class="admin-input !pl-9 !pr-10 !py-2.5 w-full text-xs font-semibold" oninput="filterSoProducts(this.value)" onkeydown="if(event.key==='Enter'){handleSoBarcodeScan(this.value);event.preventDefault();}" />
          <button type="button" onclick="openCameraScanner('so-search-keyword')" class="absolute right-2 top-1/2 -translate-y-1/2 w-7 h-7 rounded-lg bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center hover:bg-emerald-600 hover:text-white transition-all text-xs" title="Scan Barcode Kamera">
            <i class="fa-solid fa-qrcode"></i>
          </button>
        </div>
        <select id='so-product-select' class='admin-input !py-2.5 w-full' onchange='handleSoProductChange(this.value)'>
          <option value=''>-- Pilih Produk Toko --</option>
        </select>
        <input type='hidden' id='so-product-search-hidden' oninput='handleSoBarcodeScan(this.value)'/>
      </div>

      <!-- 2. Pilihan Varian (Jika Multi-Varian) -->
      <div id='so-variant-container' class='hidden'>
        <label class='text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5 block'>
          Pilih Varian
        </label>
        <select id='so-variant-select' class='admin-input !py-2.5' onchange='handleSoVariantChange(this.value)'>
        </select>
      </div>

      <!-- 3. Informasi Produk & Stok Sistem -->
      <div id='so-product-info-card' class='hidden bg-slate-50 dark:bg-slate-900/60 p-3.5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 space-y-2'>
        <div class='flex items-center gap-3'>
          <img id='so-info-img' src='' class='w-12 h-12 rounded-xl object-cover border border-slate-200 dark:border-slate-700 shrink-0 bg-white' alt='Produk'/>
          <div class='min-w-0 flex-1'>
            <h4 id='so-info-title' class='font-bold text-xs sm:text-sm text-slate-900 dark:text-white truncate'>-</h4>
            <p id='so-info-category' class='text-[10px] text-slate-400 font-semibold'>-</p>
          </div>
        </div>
        <div class='grid grid-cols-2 gap-2 pt-2 border-t border-slate-200/60 dark:border-slate-700/60 text-xs'>
          <div class='p-2 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700'>
            <span class='text-[10px] text-slate-400 font-medium block'>Stok di Sistem:</span>
            <span id='so-info-system-stock' class='font-black text-sm text-slate-800 dark:text-slate-200'>0</span>
          </div>
          <div class='p-2 bg-white dark:bg-slate-800 rounded-xl border border-slate-100 dark:border-slate-700'>
            <span class='text-[10px] text-slate-400 font-medium block'>Harga Modal HPP:</span>
            <span id='so-info-hpp' class='font-black text-sm text-slate-800 dark:text-slate-200'>Rp 0</span>
          </div>
        </div>
      </div>

      <!-- 4. Input Jumlah Fisik di Rak -->
      <div>
        <label class='text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5 flex items-center justify-between'>
          <span>Jumlah Fisik Nyata di Rak</span>
          <span class='text-[10px] text-emerald-600 dark:text-emerald-400 font-bold' id='so-unit-label'>Unit: Pcs</span>
        </label>
        <input type='number' step='any' min='0' id='so-physical-stock-input' class='admin-input !py-3 text-base font-black' placeholder='Masukkan hasil hitung fisik...' oninput='calcStockOpnameLiveDiff()' onkeydown='if(event.key==="Enter"){event.preventDefault(); saveStockOpnameAdjustment();}'/>
      </div>

      <!-- 5. Kalkulasi Selisih Live Card -->
      <div id='so-diff-result-card' class='p-3.5 rounded-2xl border transition-all space-y-2 bg-slate-50 dark:bg-slate-900 border-slate-200 dark:border-slate-700'>
        <div class='flex items-center justify-between'>
          <span class='text-xs font-bold text-slate-600 dark:text-slate-400'>Hasil Selisih Unit:</span>
          <span id='so-diff-qty-badge' class='font-black text-sm px-2.5 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200'>0 Unit</span>
        </div>
        <div class='flex items-center justify-between pt-1.5 border-t border-slate-200/60 dark:border-slate-700/60'>
          <span class='text-xs font-bold text-slate-600 dark:text-slate-400'>Nilai Selisih (HPP):</span>
          <span id='so-diff-value-badge' class='font-black text-sm text-slate-800 dark:text-slate-200'>Rp 0</span>
        </div>
      </div>

      <!-- 6. Alasan Penyesuaian -->
      <div>
        <label class='text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5 block'>
          Alasan Penyesuaian
        </label>
        <select id='so-reason-select' class='admin-input !py-2.5'>
          <option value='lost'>Selisih Hitung / Hilang</option>
          <option value='damage'>Barang Rusak / Cacat / Pecah</option>
          <option value='expired'>Barang Kadaluarsa / Expired</option>
          <option value='supplier_bonus'>Bonus / Kelebihan Supplier</option>
          <option value='initial_correction'>Koreksi Saldo Awal</option>
          <option value='other'>Lainnya</option>
        </select>
      </div>

      <!-- 7. Catatan Tambahan (Opsional) -->
      <div>
        <label class='text-[11px] font-bold text-slate-600 dark:text-slate-400 uppercase tracking-wider mb-1.5 block'>
          Catatan Tambahan (Opsional)
        </label>
        <textarea id='so-note-input' rows='2' class='admin-input !py-2 text-xs' placeholder='Keterangan rak, batch expired, dll...'></textarea>
      </div>

    </div>

    <!-- Modal Footer Actions -->
    <div class='sticky bottom-0 bg-slate-50 dark:bg-slate-900/95 backdrop-blur-sm px-4 sm:px-6 py-3.5 border-t border-slate-100 dark:border-slate-700/80 flex items-center justify-end gap-3 z-20 shrink-0'>
      <button type='button' onclick='closeStockOpnameModal()' class='px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-bold text-xs transition-all active:scale-95'>
        Batal
      </button>
      <button type='button' onclick='saveStockOpnameAdjustment()' id='btn-save-stock-opname' class='btn-primary !px-6 !py-2.5 !text-xs !font-bold active:scale-95'>
        <i class='fa-solid fa-check'></i>
        <span>Terapkan Stok Opname</span>
      </button>
    </div>

  </div>
</div>
