<!-- ========================================================================= -->
<!-- MODAL: RECEIPT PREVIEW (58MM & 80MM THERMAL)                             -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[110] bg-slate-900/80 hidden flex items-center justify-center p-3 opacity-0 transition-opacity duration-300' id='receipt-preview-modal' onclick='if(event.target===this) closeReceiptPreviewModal()'>
  <div class='bg-slate-100 dark:bg-slate-800 rounded-2xl w-full max-w-[340px] max-h-[92dvh] overflow-hidden shadow-2xl border border-slate-300/80 dark:border-slate-700/80 relative transform scale-95 transition-all duration-300 flex flex-col' id='receipt-preview-modal-box'>
    <div class='sticky top-0 bg-white dark:bg-slate-800 px-4 py-3 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center z-20'>
      <h3 class='font-bold text-slate-900 dark:text-white text-sm flex items-center gap-1.5'>
        <i class='fa-solid fa-receipt text-emerald-500'></i> Preview Struk Kasir
      </h3>
      <button class='w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-300 hover:text-rose-500 transition-colors' onclick='closeReceiptPreviewModal()'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>

    <!-- Paper Size Selector (58mm / 80mm) -->
    <div class='px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between gap-2 shrink-0'>
      <span class='text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider flex items-center gap-1'>
        <i class='fa-solid fa-print text-emerald-500'></i> Ukuran Printer:
      </span>
      <div class='flex bg-slate-200 dark:bg-slate-800 p-0.5 rounded-lg text-xs font-bold'>
        <button type='button' id='btn-paper-58' class='px-3 py-1 rounded-md transition-all text-xs font-bold' onclick='setReceiptPaperSize("58")'>58mm</button>
        <button type='button' id='btn-paper-80' class='px-3 py-1 rounded-md transition-all text-xs font-bold' onclick='setReceiptPaperSize("80")'>80mm</button>
      </div>
    </div>

    <div class='p-4 sm:p-5 flex justify-center bg-slate-200/90 dark:bg-slate-900 overflow-y-auto' style='flex: 1;'>
      <div class='relative' id='receipt-paper-wrapper'>
        <div class='bg-white p-4 font-mono text-[11px] font-bold text-black border border-slate-300/80 rounded-lg w-[260px] leading-tight transition-all relative' id='receipt-paper-content' style='font-family: &apos;JetBrains Mono&apos;, &apos;Courier New&apos;, monospace; min-height: 320px; background-color: #ffffff !important; color: #000000 !important; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15), 0 8px 10px -6px rgba(0,0,0,0.1);'></div>
      </div>
    </div>
    
    <div class='p-4 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 z-20 flex flex-col gap-2 shrink-0'>
      <button class='w-full py-2.5 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow-sm' id='btn-print-thermal-action' style='background-color: var(--clr-p);' onclick='executePrintReceipt()'>
        <i class='fa-solid fa-print'></i> Print Thermal (58mm)
      </button>
      <div class='flex gap-2 w-full'>
        <button class='flex-1 py-2 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 shadow-sm' style='background-color: var(--clr-p);' onclick='downloadReceiptImage()'>
          <i class='fa-solid fa-image'></i> Gambar
        </button>
        <button class='flex-1 py-2 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 shadow-sm' onclick='downloadReceiptPDF()'>
          <i class='fa-solid fa-file-pdf'></i> PDF
        </button>
      </div>
    </div>
  </div>
</div>
