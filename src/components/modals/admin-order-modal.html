<!-- ========================================================================= -->
<!-- MODAL: ADMIN ORDER DETAIL & PRINT OPTIONS                                 -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[100] bg-slate-900/70 hidden flex items-center justify-center p-3 sm:p-6 opacity-0 transition-opacity duration-300' id='admin-order-modal' onclick='if(event.target===this) closeOrderDetailModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-[1.5rem] w-full max-w-md sm:max-w-lg md:max-w-xl max-h-[92dvh] overflow-y-auto hide-scrollbar shadow-2xl border-2 border-slate-200 dark:border-slate-700 relative transform scale-95 transition-transform duration-300 flex flex-col' id='admin-order-modal-box'>
    <div class='sticky top-0 bg-white dark:bg-slate-800 px-5 py-4 border-b-2 border-slate-200 dark:border-slate-700 flex justify-between items-center z-20 rounded-t-[1.5rem]'>
      <h3 class='font-bold text-slate-900 dark:text-white text-sm flex items-center gap-2'>
        <i class='fa-solid fa-file-invoice text-emerald-600 dark:text-emerald-400'></i> Detail Pesanan
      </h3>
      <button class='w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-700 border-2 border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-600 dark:hover:text-rose-400 transition-all' onclick='closeOrderDetailModal()'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>
    
    <div class='p-5 space-y-4 flex-1 bg-slate-50 dark:bg-slate-900' id='admin-order-modal-content'></div>
    
    <div class='hidden absolute bottom-16 left-4 right-4 bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 rounded-2xl p-2 shadow-2xl z-30 flex flex-col gap-1 text-left' id='print-options-menu'>
      <button class='w-full text-left px-4 py-3 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-2.5 transition-colors' onclick='openReceiptPreview(); togglePrintMenu();'><i class='fa-solid fa-receipt text-emerald-500 text-sm'></i> Cetak Struk Kasir (58mm)</button>
      <button class='w-full text-left px-4 py-3 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-2.5 transition-colors' onclick='generateA4Document(&apos;invoice&apos;)'><i class='fa-solid fa-file-invoice text-blue-500 text-sm'></i> Unduh Invoice Tagihan (A4 PDF)</button>
      <button class='w-full text-left px-4 py-3 text-xs font-semibold text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl flex items-center gap-2.5 transition-colors' onclick='generateA4Document(&apos;surat-jalan&apos;)'><i class='fa-solid fa-truck text-rose-500 text-sm'></i> Unduh Surat Jalan (A4 PDF)</button>
    </div>

    <div class='p-4 sticky bottom-0 bg-white dark:bg-slate-800 border-t-2 border-slate-200 dark:border-slate-700 z-20 rounded-b-[1.5rem] flex gap-2'>
      <button class='flex-1 py-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 border-2 border-slate-200 dark:border-slate-600' onclick='togglePrintMenu()'>
        <i class='fa-solid fa-print'></i> Cetak
      </button>
      <button class='flex-1 py-3 bg-rose-50 dark:bg-rose-900/30 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 border-2 border-rose-200 dark:border-rose-800' onclick='deleteOrder(cVOrd)'>
        <i class='fa-solid fa-trash'></i> Hapus
      </button>
    </div>
  </div>
</div>
