<!-- ========================================================================= -->
<!-- MODAL: ADMIN ORDER DETAIL & PRINT OPTIONS                                 -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[100] bg-slate-900/70 hidden flex items-center justify-center p-3 sm:p-6 opacity-0 transition-opacity duration-300' id='admin-order-modal' onclick='if(event.target===this) closeOrderDetailModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-2xl w-full max-w-md sm:max-w-lg md:max-w-xl max-h-[92dvh] overflow-y-auto hide-scrollbar shadow-2xl border border-slate-200/80 dark:border-slate-700/80 relative transform scale-95 transition-transform duration-300 flex flex-col' id='admin-order-modal-box'>
    <div class='sticky top-0 bg-white dark:bg-slate-800 px-5 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center z-20 rounded-t-2xl'>
      <h3 class='font-bold text-slate-900 dark:text-white text-sm flex items-center gap-2'>
        <i class='fa-solid fa-file-invoice text-emerald-600 dark:text-emerald-400'></i> Detail Pesanan
      </h3>
      <button class='w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-600 dark:hover:text-rose-400 transition-all' onclick='closeOrderDetailModal()'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>
    
    <div class='p-5 space-y-4 flex-1 bg-slate-50 dark:bg-slate-900' id='admin-order-modal-content'></div>
    
    <div class='p-3.5 sm:p-4 sticky bottom-0 bg-white dark:bg-slate-800 border-t-2 border-slate-200 dark:border-slate-700 z-20 rounded-b-2xl flex items-center gap-2'>
      <button type='button' class='flex-1 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 shadow-sm active:scale-95' onclick='openReceiptPreview()'>
        <i class='fa-solid fa-receipt text-xs'></i> <span>Struk Kasir</span>
      </button>
      <button type='button' class='flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 shadow-sm active:scale-95' onclick='generateA4Document("invoice")'>
        <i class='fa-solid fa-file-invoice text-xs'></i> <span>Invoice</span>
      </button>
      <button type='button' class='flex-1 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 shadow-sm active:scale-95' onclick='generateA4Document("surat-jalan")'>
        <i class='fa-solid fa-truck text-xs'></i> <span>Surat Jalan</span>
      </button>
      <button type='button' class='w-10 h-10 bg-rose-50 dark:bg-rose-900/30 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 font-bold rounded-xl text-xs transition-all flex items-center justify-center shrink-0 border border-rose-200 dark:border-rose-800 active:scale-95' onclick='deleteOrder(cVOrd)' title='Hapus Pesanan'>
        <i class='fa-solid fa-trash'></i>
      </button>
    </div>
  </div>
</div>
