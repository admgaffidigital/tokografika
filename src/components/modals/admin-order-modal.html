<!-- ========================================================================= -->
<!-- MODAL: ADMIN ORDER DETAIL & PRINT OPTIONS                                 -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[100] bg-slate-900/70 hidden flex items-end sm:items-center justify-center p-0 sm:p-6 opacity-0 modal-backdrop-smooth' id='admin-order-modal' onclick='if(event.target===this) closeOrderDetailModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-t-[2rem] sm:rounded-2xl w-full max-w-full sm:max-w-2xl md:max-w-3xl lg:max-w-4xl max-h-[92dvh] sm:max-h-[88dvh] overflow-y-auto hide-scrollbar shadow-2xl border-t sm:border border-slate-200/80 dark:border-slate-700/80 relative transform translate-y-full sm:translate-y-0 sm:scale-95 bottom-sheet-smooth flex flex-col' id='admin-order-modal-box'>
    
    <!-- Mobile Drag Handle -->
    <div class="sm:hidden w-12 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mt-2.5 mb-1 shrink-0"></div>
    <div class='sticky top-0 bg-white dark:bg-slate-800 px-5 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center z-20 rounded-t-2xl'>
      <h3 class='font-bold text-slate-900 dark:text-white text-sm flex items-center gap-2'>
        <i class='fa-solid fa-file-invoice text-emerald-600 dark:text-emerald-400'></i> Detail Pesanan
      </h3>
      <button class='w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-600 dark:hover:text-rose-400 transition-all' onclick='closeOrderDetailModal()' title='Tutup'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>
    
    <div class='p-4 sm:p-6 space-y-4 flex-1 bg-slate-50 dark:bg-slate-900' id='admin-order-modal-content'></div>
    
    <div class='p-3 sm:p-4 sticky bottom-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md border-t border-slate-200 dark:border-slate-700 z-20 rounded-b-2xl shadow-xl'>
      <div class='flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5'>
        <!-- Dokumen & Hapus (Secondary Actions) -->
        <div class='flex items-center gap-2 order-2 sm:order-1'>
          <button type='button' class='h-10 px-3 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 border border-rose-200 dark:border-rose-800 active:scale-95' onclick='deleteOrder(cVOrd)' title='Hapus Pesanan'>
            <i class='fa-solid fa-trash-can'></i> <span>Hapus</span>
          </button>
          <button type='button' class='flex-1 sm:flex-none h-10 px-3.5 bg-slate-100 dark:bg-slate-700/70 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 border border-slate-200 dark:border-slate-600 active:scale-95' onclick='generateA4Document("invoice")' title='Cetak Faktur Invoice A4'>
            <i class='fa-solid fa-file-invoice text-blue-500'></i> <span>Invoice</span>
          </button>
          <button type='button' class='flex-1 sm:flex-none h-10 px-3.5 bg-slate-100 dark:bg-slate-700/70 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 border border-slate-200 dark:border-slate-600 active:scale-95' onclick='generateA4Document("surat-jalan")' title='Cetak Surat Jalan A4'>
            <i class='fa-solid fa-truck text-amber-500'></i> <span>Surat Jalan</span>
          </button>
        </div>

        <!-- Struk Kasir & WhatsApp (Primary Actions) -->
        <div class='flex items-center gap-2 order-1 sm:order-2 flex-1 sm:justify-end'>
          <button type='button' class='flex-1 sm:flex-initial h-10 px-4 bg-emerald-50 hover:bg-emerald-100 dark:bg-emerald-950/50 dark:hover:bg-emerald-900/60 text-emerald-700 dark:text-emerald-300 font-bold rounded-xl text-xs border border-emerald-300 dark:border-emerald-700/80 transition-all flex items-center justify-center gap-2 shadow-sm active:scale-95' onclick='shareReceiptWhatsApp()' title='Kirim Rincian Struk via WhatsApp'>
            <i class='fa-brands fa-whatsapp text-emerald-600 dark:text-emerald-400 text-base'></i> <span>Kirim WA</span>
          </button>
          <button type='button' class='flex-1 sm:flex-initial h-10 px-5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-2 shadow-md hover:shadow-lg active:scale-95' onclick='openReceiptPreview()'>
            <i class='fa-solid fa-receipt text-xs'></i> <span>Struk Kasir</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
