<!-- ========================================================================= -->
<!-- MODAL: CETAK PRICETAG RAK TOKO & LABEL BARCODE PRODUK                     -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[105] bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-2 sm:p-4 md:p-6 opacity-0 transition-opacity duration-300' id='pricetag-barcode-modal' onclick='if(event.target===this) closePricetagBarcodeModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-3xl w-full max-w-5xl max-h-[96dvh] flex flex-col shadow-2xl border border-slate-200/90 dark:border-slate-700/90 relative transform scale-95 transition-all duration-300 overflow-hidden' id='pricetag-barcode-modal-box'>
    
    <!-- Modal Header (Spacious & Clean) -->
    <div class='sticky top-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md px-5 sm:px-7 py-4 border-b border-slate-200/80 dark:border-slate-700/80 flex justify-between items-center z-20 shrink-0'>
      <div class='flex items-center gap-3.5 min-w-0'>
        <div class='w-11 h-11 rounded-2xl flex items-center justify-center text-xl shadow-xs shrink-0' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
          <i class='fa-solid fa-tags'></i>
        </div>
        <div class='min-w-0'>
          <div class='flex items-center gap-2.5 flex-wrap'>
            <h3 class='font-black text-slate-900 dark:text-white text-base sm:text-lg tracking-tight truncate'>
              Cetak Pricetag Rak & Label Barcode
            </h3>
            <span class='text-[10px] font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full border shrink-0' style='background-color:var(--clr-p-bg);color:var(--clr-p);border-color:var(--clr-p-25)'>A4 HVS & Stiker</span>
          </div>
          <p class='text-xs text-slate-500 dark:text-slate-400 font-medium leading-relaxed mt-0.5'>Format presisi kertas HVS A4 siap potong & label barcode produk</p>
        </div>
      </div>
      <button class='w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 transition-all flex items-center justify-center border border-slate-200 dark:border-slate-600 shrink-0 ml-3 active:scale-95' onclick='closePricetagBarcodeModal()'>
        <i class='fa-solid fa-xmark text-base'></i>
      </button>
    </div>

    <!-- Mode Selector Tab & Layout Controls -->
    <div class='bg-slate-50/90 dark:bg-slate-900/90 px-5 sm:px-7 py-3 border-b border-slate-200/80 dark:border-slate-700/80 flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 shrink-0'>
      <div class='flex bg-slate-200/80 dark:bg-slate-800 p-1.5 rounded-2xl gap-1.5 text-xs font-bold w-full sm:w-auto shadow-inner'>
        <button type='button' id='btn-tab-pricetag' class='flex-1 sm:flex-initial px-4 py-2 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm bg-white dark:bg-slate-700 font-black' style='color:var(--clr-p)' onclick='switchPricetagMode("pricetag")'>
          <i class='fa-solid fa-tag text-sm'></i> <span>Pricetag Rak (A4 HVS)</span>
        </button>
        <button type='button' id='btn-tab-barcode' class='flex-1 sm:flex-initial px-4 py-2 rounded-xl transition-all flex items-center justify-center gap-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white font-bold' onclick='switchPricetagMode("barcode")'>
          <i class='fa-solid fa-barcode text-sm'></i> <span>Label Stiker Barcode</span>
        </button>
      </div>

      <!-- Tag Layout Size Dropdown -->
      <div class='flex items-center gap-2 text-xs font-semibold text-slate-600 dark:text-slate-300 w-full sm:w-auto justify-between sm:justify-end' id='tag-size-select-wrap'>
        <span class='text-[11px] text-slate-500 dark:text-slate-400 font-bold uppercase tracking-wider'>Ukuran Grid:</span>
        <select id='tag-layout-size' class='admin-input !py-2 !px-3 text-xs font-bold rounded-xl cursor-pointer bg-white dark:bg-slate-800 shadow-xs border-slate-200 dark:border-slate-700' onchange='refreshPricetagPreviewIfActive()'>
          <option value='standard'>Standar Rak (16 Tag / Lembar A4)</option>
          <option value='large'>Besar Promo (10 Tag / Lembar A4)</option>
          <option value='compact'>Mini / ATK (24 Tag / Lembar A4)</option>
        </select>
      </div>
    </div>

    <!-- Modal Body: Step 1 Selection or Step 2 Preview -->
    <div class='flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-100/60 dark:bg-slate-900' id='pricetag-modal-body'>
      
      <!-- STEP 1: Product Selection View -->
      <div id='pricetag-step-selection' class='space-y-4'>
        <!-- Spacious 2-Tier Search & Filter Bar -->
        <div class='bg-white dark:bg-slate-800 p-4 sm:p-5 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm space-y-3'>
          <!-- Row 1: Full-Width Search Input -->
          <div class='relative w-full'>
            <i class='fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm'></i>
            <input type='text' id='pricetag-search-input' oninput='filterPrintProductsList()' placeholder='Cari berdasarkan nama produk, SKU, atau kode barcode...' class='admin-input !pl-11 !pr-4 !py-3 w-full text-xs sm:text-sm !rounded-xl shadow-xs' />
          </div>

          <!-- Row 2: Category Dropdown & Select All / Reset Actions -->
          <div class='flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-2.5 pt-1 border-t border-slate-100 dark:border-slate-700/60'>
            <div class='flex items-center gap-2 flex-1'>
              <span class='text-xs font-bold text-slate-500 dark:text-slate-400 shrink-0'>Kategori:</span>
              <select id='pricetag-cat-filter' onchange='filterPrintProductsList()' class='admin-input !py-2 !px-3 text-xs font-bold rounded-xl cursor-pointer flex-1 sm:max-w-[240px] bg-slate-50 dark:bg-slate-700/50'>
                <option value='all'>Semua Kategori</option>
              </select>
            </div>
            
            <div class='flex items-center gap-2 shrink-0'>
              <button type='button' onclick='toggleSelectAllPrintProducts(true)' class='flex-1 sm:flex-initial px-4 py-2 border rounded-xl text-xs font-bold transition-all active:scale-95 flex items-center justify-center gap-1.5 shadow-xs' style='background-color:var(--clr-p-bg);color:var(--clr-p);border-color:var(--clr-p-25)' title='Pilih Semua Produk'>
                <i class='fa-solid fa-check-double'></i> <span>Pilih Semua</span>
              </button>
              <button type='button' onclick='toggleSelectAllPrintProducts(false)' class='flex-1 sm:flex-initial px-4 py-2 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-600 border border-slate-200 dark:border-slate-600 rounded-xl text-xs font-bold transition-all active:scale-95 flex items-center justify-center gap-1.5 shadow-xs' title='Batal Pilih'>
                <i class='fa-solid fa-xmark'></i> <span>Reset</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Product List Card with Header Info -->
        <div class='bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-hidden'>
          <div class='px-5 py-3.5 bg-slate-50 dark:bg-slate-800/90 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between text-xs font-bold text-slate-600 dark:text-slate-300'>
            <span class='flex items-center gap-2'>
              <i class='fa-solid fa-boxes-stacked' style='color:var(--clr-p)'></i>
              <span>Daftar Produk Toko</span>
            </span>
            <span id='pricetag-selected-summary' class='font-black px-3 py-1 rounded-full border' style='background-color:var(--clr-p-bg);color:var(--clr-p);border-color:var(--clr-p-25)'>0 Produk Dipilih (0 Label)</span>
          </div>
          <div class='divide-y divide-slate-100 dark:divide-slate-700/60 max-h-[420px] sm:max-h-[460px] overflow-y-auto' id='pricetag-product-list-container'>
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- STEP 2: Sheet Preview View -->
      <div id='pricetag-step-preview' class='hidden space-y-4'>
        <div class='flex flex-wrap items-center justify-between bg-white dark:bg-slate-800 p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm gap-3'>
          <div class='flex items-center gap-2.5'>
            <button type='button' onclick='showPricetagStep("selection")' class='px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 rounded-xl text-xs font-bold transition-all flex items-center gap-2 shadow-xs active:scale-95'>
              <i class='fa-solid fa-arrow-left'></i> <span>Ubah Pilihan Produk</span>
            </button>
            <span class='text-xs font-bold text-slate-600 dark:text-slate-300 ml-1' id='pricetag-preview-page-info'>Total 1 Halaman A4 (1 Label)</span>
          </div>

          <!-- Zoom & Multi-page Navigation -->
          <div class='flex items-center gap-2.5'>
            <div class='hidden sm:flex items-center gap-1 bg-slate-100 dark:bg-slate-700/80 p-1 rounded-xl text-xs font-bold border border-slate-200 dark:border-slate-600'>
              <button type='button' onclick='setPricetagZoom(0.5)' class='px-2.5 py-1 rounded-lg hover:bg-white dark:hover:bg-slate-600 transition-all'>50%</button>
              <button type='button' onclick='setPricetagZoom(0.75)' class='px-2.5 py-1 rounded-lg hover:bg-white dark:hover:bg-slate-600 transition-all'>75%</button>
              <button type='button' onclick='setPricetagZoom(1)' class='px-2.5 py-1 rounded-lg hover:bg-white dark:hover:bg-slate-600 transition-all bg-white dark:bg-slate-600 shadow-xs' id='btn-zoom-100'>100%</button>
            </div>
            <div class='flex items-center gap-1.5' id='pricetag-page-nav-btns'>
              <!-- Multi-page select injected dynamically -->
            </div>
          </div>
        </div>

        <!-- Rendered A4 Preview Container with responsive auto-fit -->
        <div class='w-full flex justify-center overflow-x-auto pb-6 pt-2'>
          <div id='pricetag-sheets-zoom-wrapper' class='transition-transform duration-200 origin-top flex flex-col items-center gap-8'>
            <div id='pricetag-sheets-render-container' class='space-y-8'>
              <!-- Generated A4 sheets will be injected here -->
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Modal Sticky Footer Actions (Spacious & Prominent) -->
    <div class='px-5 sm:px-7 py-4 bg-white dark:bg-slate-800 border-t border-slate-200/80 dark:border-slate-700/80 z-20 flex flex-col sm:flex-row items-center justify-between gap-3.5 shrink-0'>
      <div class='flex items-center gap-2 w-full sm:w-auto justify-between sm:justify-start'>
        <span class='text-xs sm:text-sm font-black text-slate-800 dark:text-slate-100' id='pricetag-footer-count-badge'>
          0 Label Siap Dicetak
        </span>
      </div>

      <div class='flex items-center gap-2.5 w-full sm:w-auto justify-end'>
        <!-- When on Step 1 -->
        <button type='button' id='btn-proceed-preview-pricetag' onclick='proceedToPricetagPreview()' class='w-full sm:w-auto px-6 py-3 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow-md active:scale-95' style='background-color:var(--clr-p)'>
          <span>Lihat Pratinjau Cetak</span> <i class='fa-solid fa-arrow-right'></i>
        </button>

        <!-- When on Step 2 (Preview) -->
        <div id='pricetag-preview-actions' class='hidden w-full sm:w-auto flex flex-wrap items-center gap-2.5'>
          <button type='button' onclick='executePrintPricetags()' class='flex-1 sm:flex-initial px-5 py-3 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow-md active:scale-95' style='background-color:var(--clr-p)'>
            <i class='fa-solid fa-print text-sm'></i> <span>Cetak ke Printer</span>
          </button>
          <button type='button' onclick='downloadPricetagPdf()' class='flex-1 sm:flex-initial px-5 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center justify-center gap-2 shadow-md active:scale-95'>
            <i class='fa-solid fa-file-pdf text-sm'></i> <span>Unduh PDF A4</span>
          </button>
          <button type='button' onclick='downloadPricetagImage()' class='px-4 py-3 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs transition-all flex items-center justify-center gap-1.5 active:scale-95 border border-slate-200 dark:border-slate-600 shadow-xs'>
            <i class='fa-solid fa-image text-sm'></i> <span class='hidden sm:inline'>Gambar</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
