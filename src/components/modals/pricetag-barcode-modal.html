<!-- ========================================================================= -->
<!-- MODAL: CETAK PRICETAG RAK TOKO & LABEL BARCODE PRODUK                     -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[105] bg-slate-900/75 hidden flex items-center justify-center p-2 sm:p-4 md:p-6 opacity-0 transition-opacity duration-300' id='pricetag-barcode-modal' onclick='if(event.target===this) closePricetagBarcodeModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-2xl w-full max-w-4xl max-h-[94dvh] flex flex-col shadow-2xl border border-slate-200/80 dark:border-slate-700/80 relative transform scale-95 transition-all duration-300 overflow-hidden' id='pricetag-barcode-modal-box'>
    
    <!-- Modal Header -->
    <div class='sticky top-0 bg-white dark:bg-slate-800 px-4 sm:px-6 py-3.5 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center z-20 shrink-0'>
      <div class='flex items-center gap-3'>
        <div class='w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-lg shadow-sm border border-emerald-200/60 dark:border-emerald-800/40'>
          <i class='fa-solid fa-tags'></i>
        </div>
        <div>
          <h3 class='font-bold text-slate-900 dark:text-white text-sm sm:base flex items-center gap-2'>
            <span>Cetak Pricetag Rak & Label Barcode</span>
            <span class='badge badge-solid-emerald text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full'>A4 & Stiker</span>
          </h3>
          <p class='text-[10px] sm:text-xs text-slate-400 font-medium'>Pilih produk, tentukan jumlah cetak, dan print pada kertas A4 atau stiker</p>
        </div>
      </div>
      <button class='w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 transition-all flex items-center justify-center border border-slate-200 dark:border-slate-600' onclick='closePricetagBarcodeModal()'>
        <i class='fa-solid fa-xmark text-sm'></i>
      </button>
    </div>

    <!-- Mode Selector Tab (Pricetag vs Barcode Sticker) -->
    <div class='bg-slate-50 dark:bg-slate-900 px-4 sm:px-6 py-2.5 border-b border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3 shrink-0'>
      <div class='flex bg-slate-200 dark:bg-slate-800 p-1 rounded-xl gap-1 text-xs font-bold'>
        <button type='button' id='btn-tab-pricetag' class='px-3.5 py-1.5 rounded-lg transition-all flex items-center gap-1.5 shadow-sm bg-white dark:bg-slate-700 text-emerald-600 dark:text-emerald-400 font-black' onclick='switchPricetagMode("pricetag")'>
          <i class='fa-solid fa-tag'></i> <span>Pricetag Rak (A4 HVS)</span>
        </button>
        <button type='button' id='btn-tab-barcode' class='px-3.5 py-1.5 rounded-lg transition-all flex items-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900' onclick='switchPricetagMode("barcode")'>
          <i class='fa-solid fa-barcode'></i> <span>Label Stiker Barcode</span>
        </button>
      </div>

      <!-- Quick Option Switches -->
      <div class='flex items-center gap-3 text-xs font-semibold text-slate-600 dark:text-slate-300'>
        <div class='flex items-center gap-1.5' id='tag-size-select-wrap'>
          <span class='text-[10px] text-slate-400 font-bold uppercase'>Ukuran:</span>
          <select id='tag-layout-size' class='admin-input !py-1 !px-2 text-xs font-bold rounded-lg cursor-pointer' onchange='refreshPricetagPreviewIfActive()'>
            <option value='standard'>Standar Rak (16 Tag / A4)</option>
            <option value='large'>Besar Promo (10 Tag / A4)</option>
            <option value='compact'>Mini / ATK (24 Tag / A4)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Modal Body: Step 1 Selection or Step 2 Preview -->
    <div class='flex-1 overflow-y-auto p-4 sm:p-6 bg-slate-100/70 dark:bg-slate-900' id='pricetag-modal-body'>
      
      <!-- STEP 1: Product Selection View -->
      <div id='pricetag-step-selection' class='space-y-4'>
        <!-- Search & Filter Bar -->
        <div class='bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between'>
          <div class='relative flex-1'>
            <i class='fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs'></i>
            <input type='text' id='pricetag-search-input' oninput='filterPrintProductsList()' placeholder='Cari nama produk, SKU, atau barcode...' class='admin-input !pl-9 !py-2 w-full text-xs' />
          </div>
          <div class='flex items-center gap-2'>
            <select id='pricetag-cat-filter' onchange='filterPrintProductsList()' class='admin-input !py-2 text-xs font-bold rounded-xl cursor-pointer max-w-[150px]'>
              <option value='all'>Semua Kategori</option>
            </select>
            <button type='button' onclick='toggleSelectAllPrintProducts(true)' class='px-3 py-2 bg-emerald-50 dark:bg-emerald-950/40 hover:bg-emerald-100 text-emerald-700 dark:text-emerald-300 border border-emerald-200 dark:border-emerald-800 rounded-xl text-xs font-bold transition-all shrink-0 active:scale-95' title='Pilih Semua'>
              <i class='fa-solid fa-check-double mr-1'></i> Semua
            </button>
            <button type='button' onclick='toggleSelectAllPrintProducts(false)' class='px-3 py-2 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 rounded-xl text-xs font-bold transition-all shrink-0 active:scale-95' title='Batal Pilih'>
              <i class='fa-solid fa-xmark mr-1'></i> Reset
            </button>
          </div>
        </div>

        <!-- Product List with Qty Steppers -->
        <div class='bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-hidden'>
          <div class='px-4 py-2.5 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between text-[11px] font-bold text-slate-500 dark:text-slate-400'>
            <span>Daftar Produk Toko</span>
            <span id='pricetag-selected-summary'>0 Produk Dipilih (0 Label)</span>
          </div>
          <div class='divide-y divide-slate-100 dark:divide-slate-700/60 max-h-[380px] overflow-y-auto' id='pricetag-product-list-container'>
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- STEP 2: Sheet Preview View -->
      <div id='pricetag-step-preview' class='hidden space-y-4'>
        <div class='flex items-center justify-between bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm'>
          <div class='flex items-center gap-2'>
            <button type='button' onclick='showPricetagStep("selection")' class='px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5'>
              <i class='fa-solid fa-arrow-left'></i> <span>Ubah Pilihan Produk</span>
            </button>
            <span class='text-xs font-bold text-slate-600 dark:text-slate-300 ml-2' id='pricetag-preview-page-info'>Halaman 1 dari 1</span>
          </div>
          <div class='flex items-center gap-1.5' id='pricetag-page-nav-btns'>
            <!-- Multi-page navigation buttons -->
          </div>
        </div>

        <!-- Rendered A4 Preview Container -->
        <div class='flex justify-center overflow-x-auto pb-4'>
          <div id='pricetag-sheets-render-container' class='space-y-6'>
            <!-- Generated A4 sheets will be injected here -->
          </div>
        </div>
      </div>

    </div>

    <!-- Modal Sticky Footer Actions -->
    <div class='p-4 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 z-20 flex flex-wrap items-center justify-between gap-3 shrink-0'>
      <div class='flex items-center gap-2'>
        <span class='text-xs font-bold text-slate-700 dark:text-slate-200' id='pricetag-footer-count-badge'>
          0 Label Siap Cetak
        </span>
      </div>

      <div class='flex items-center gap-2'>
        <!-- When on Step 1 -->
        <button type='button' id='btn-proceed-preview-pricetag' onclick='proceedToPricetagPreview()' class='px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center gap-2 shadow-sm active:scale-95'>
          <span>Lihat Pratinjau Cetak</span> <i class='fa-solid fa-arrow-right'></i>
        </button>

        <!-- When on Step 2 (Preview) -->
        <div id='pricetag-preview-actions' class='hidden flex items-center gap-2'>
          <button type='button' onclick='executePrintPricetags()' class='px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center gap-1.5 shadow-sm active:scale-95'>
            <i class='fa-solid fa-print'></i> <span>Cetak ke Printer</span>
          </button>
          <button type='button' onclick='downloadPricetagPdf()' class='px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center gap-1.5 shadow-sm active:scale-95'>
            <i class='fa-solid fa-file-pdf'></i> <span>Unduh PDF A4</span>
          </button>
          <button type='button' onclick='downloadPricetagImage()' class='px-3.5 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs transition-all flex items-center gap-1.5 active:scale-95'>
            <i class='fa-solid fa-image'></i> <span>Gambar</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
