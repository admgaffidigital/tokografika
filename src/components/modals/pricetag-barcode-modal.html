<!-- ========================================================================= -->
<!-- MODAL: CETAK PRICETAG RAK TOKO & LABEL BARCODE PRODUK                     -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[105] bg-slate-900/80 backdrop-blur-xs hidden flex items-center justify-center p-2 sm:p-4 md:p-6 opacity-0 transition-opacity duration-300' id='pricetag-barcode-modal' onclick='if(event.target===this) closePricetagBarcodeModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-2xl w-full max-w-4xl max-h-[94dvh] flex flex-col shadow-2xl border border-slate-200/80 dark:border-slate-700/80 relative transform scale-95 transition-all duration-300 overflow-hidden' id='pricetag-barcode-modal-box'>
    
    <!-- Modal Header (Theme Harmonized) -->
    <div class='sticky top-0 bg-white dark:bg-slate-800 px-4 sm:px-6 py-3.5 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center z-20 shrink-0'>
      <div class='flex items-center gap-3 min-w-0'>
        <div class='w-10 h-10 rounded-xl flex items-center justify-center text-lg shadow-sm shrink-0' style='background-color:var(--clr-p-bg);color:var(--clr-p)'>
          <i class='fa-solid fa-tags'></i>
        </div>
        <div class='min-w-0'>
          <div class='flex items-center gap-2 flex-wrap'>
            <h3 class='font-bold text-slate-900 dark:text-white text-sm sm:text-base truncate'>
              Cetak Pricetag Rak & Label Barcode
            </h3>
            <span class='text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-md border shrink-0' style='background-color:var(--clr-p-bg);color:var(--clr-p);border-color:var(--clr-p-10)'>A4 & Stiker</span>
          </div>
          <p class='text-[10px] sm:text-xs text-slate-400 font-medium truncate mt-0.5'>Format presisi kertas HVS A4 siap potong & label barcode produk</p>
        </div>
      </div>
      <button class='w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 transition-all flex items-center justify-center border border-slate-200 dark:border-slate-600 shrink-0 ml-2' onclick='closePricetagBarcodeModal()'>
        <i class='fa-solid fa-xmark text-sm'></i>
      </button>
    </div>

    <!-- Mode Selector Tab (Pricetag vs Barcode Sticker) -->
    <div class='bg-slate-50 dark:bg-slate-900/80 px-4 sm:px-6 py-2.5 border-b border-slate-200 dark:border-slate-700 flex flex-wrap items-center justify-between gap-3 shrink-0'>
      <div class='flex bg-slate-200/80 dark:bg-slate-800 p-1 rounded-xl gap-1 text-xs font-bold w-full sm:w-auto'>
        <button type='button' id='btn-tab-pricetag' class='flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg transition-all flex items-center justify-center gap-1.5 shadow-sm bg-white dark:bg-slate-700 font-black' style='color:var(--clr-p)' onclick='switchPricetagMode("pricetag")'>
          <i class='fa-solid fa-tag'></i> <span>Pricetag Rak (A4 HVS)</span>
        </button>
        <button type='button' id='btn-tab-barcode' class='flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg transition-all flex items-center justify-center gap-1.5 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white' onclick='switchPricetagMode("barcode")'>
          <i class='fa-solid fa-barcode'></i> <span>Label Stiker Barcode</span>
        </button>
      </div>

      <!-- Quick Option Switches -->
      <div class='flex items-center gap-3 text-xs font-semibold text-slate-600 dark:text-slate-300 w-full sm:w-auto justify-between sm:justify-end'>
        <div class='flex items-center gap-1.5' id='tag-size-select-wrap'>
          <span class='text-[10px] text-slate-400 font-bold uppercase'>Ukuran:</span>
          <select id='tag-layout-size' class='admin-input !py-1.5 !px-2.5 text-xs font-bold rounded-xl cursor-pointer bg-white dark:bg-slate-800' onchange='refreshPricetagPreviewIfActive()'>
            <option value='standard'>Standar Rak (16 Tag / A4)</option>
            <option value='large'>Besar Promo (10 Tag / A4)</option>
            <option value='compact'>Mini / ATK (24 Tag / A4)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Modal Body: Step 1 Selection or Step 2 Preview -->
    <div class='flex-1 overflow-y-auto p-3 sm:p-5 bg-slate-100/70 dark:bg-slate-900' id='pricetag-modal-body'>
      
      <!-- STEP 1: Product Selection View -->
      <div id='pricetag-step-selection' class='space-y-3 sm:space-y-4'>
        <!-- Search & Filter Bar -->
        <div class='bg-white dark:bg-slate-800 p-3 sm:p-4 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm flex flex-col sm:flex-row gap-2.5 items-stretch sm:items-center justify-between'>
          <div class='relative flex-1'>
            <i class='fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs'></i>
            <input type='text' id='pricetag-search-input' oninput='filterPrintProductsList()' placeholder='Cari nama produk, SKU, barcode...' class='admin-input !pl-9 !py-2.5 w-full text-xs' />
          </div>
          <div class='flex items-center gap-2'>
            <select id='pricetag-cat-filter' onchange='filterPrintProductsList()' class='admin-input !py-2.5 text-xs font-bold rounded-xl cursor-pointer flex-1 sm:flex-initial sm:max-w-[150px]'>
              <option value='all'>Semua Kategori</option>
            </select>
            <button type='button' onclick='toggleSelectAllPrintProducts(true)' class='px-3 py-2.5 border rounded-xl text-xs font-bold transition-all shrink-0 active:scale-95 flex items-center gap-1 shadow-xs' style='background-color:var(--clr-p-bg);color:var(--clr-p);border-color:var(--clr-p-10)' title='Pilih Semua'>
              <i class='fa-solid fa-check-double'></i> <span class='hidden sm:inline'>Pilih</span> Semua
            </button>
            <button type='button' onclick='toggleSelectAllPrintProducts(false)' class='px-3 py-2.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-200 border border-slate-200 dark:border-slate-600 rounded-xl text-xs font-bold transition-all shrink-0 active:scale-95 flex items-center gap-1 shadow-xs' title='Batal Pilih'>
              <i class='fa-solid fa-xmark'></i> Reset
            </button>
          </div>
        </div>

        <!-- Product List with Qty Steppers -->
        <div class='bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm overflow-hidden'>
          <div class='px-4 py-3 bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between text-xs font-bold text-slate-500 dark:text-slate-400'>
            <span>Daftar Produk Toko</span>
            <span id='pricetag-selected-summary' class='font-black' style='color:var(--clr-p)'>0 Produk Dipilih (0 Label)</span>
          </div>
          <div class='divide-y divide-slate-100 dark:divide-slate-700/60 max-h-[380px] sm:max-h-[420px] overflow-y-auto' id='pricetag-product-list-container'>
            <!-- Populated dynamically -->
          </div>
        </div>
      </div>

      <!-- STEP 2: Sheet Preview View -->
      <div id='pricetag-step-preview' class='hidden space-y-3 sm:space-y-4'>
        <div class='flex flex-wrap items-center justify-between bg-white dark:bg-slate-800 p-3 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 shadow-sm gap-2'>
          <div class='flex items-center gap-2'>
            <button type='button' onclick='showPricetagStep("selection")' class='px-3 py-1.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5'>
              <i class='fa-solid fa-arrow-left'></i> <span>Ubah Pilihan</span>
            </button>
            <span class='text-xs font-bold text-slate-600 dark:text-slate-300 ml-1' id='pricetag-preview-page-info'>Halaman 1 dari 1</span>
          </div>

          <!-- Zoom & Multi-page controls -->
          <div class='flex items-center gap-2'>
            <div class='hidden sm:flex items-center gap-1 bg-slate-100 dark:bg-slate-700 p-1 rounded-xl text-[11px] font-bold'>
              <button type='button' onclick='setPricetagZoom(0.5)' class='px-2 py-0.5 rounded-lg hover:bg-white dark:hover:bg-slate-600 transition-all'>50%</button>
              <button type='button' onclick='setPricetagZoom(0.75)' class='px-2 py-0.5 rounded-lg hover:bg-white dark:hover:bg-slate-600 transition-all'>75%</button>
              <button type='button' onclick='setPricetagZoom(1)' class='px-2 py-0.5 rounded-lg hover:bg-white dark:hover:bg-slate-600 transition-all bg-white dark:bg-slate-600 shadow-xs' id='btn-zoom-100'>100%</button>
            </div>
            <div class='flex items-center gap-1' id='pricetag-page-nav-btns'>
              <!-- Multi-page navigation buttons -->
            </div>
          </div>
        </div>

        <!-- Rendered A4 Preview Container with responsive auto-fit -->
        <div class='w-full flex justify-center overflow-x-auto pb-4 pt-1'>
          <div id='pricetag-sheets-zoom-wrapper' class='transition-transform duration-200 origin-top flex flex-col items-center gap-6'>
            <div id='pricetag-sheets-render-container' class='space-y-6'>
              <!-- Generated A4 sheets will be injected here -->
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Modal Sticky Footer Actions -->
    <div class='p-3 sm:p-4 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 z-20 flex flex-wrap items-center justify-between gap-3 shrink-0'>
      <div class='flex items-center gap-2'>
        <span class='text-xs font-bold text-slate-700 dark:text-slate-200' id='pricetag-footer-count-badge'>
          0 Label Siap Cetak
        </span>
      </div>

      <div class='flex items-center gap-2'>
        <!-- When on Step 1 -->
        <button type='button' id='btn-proceed-preview-pricetag' onclick='proceedToPricetagPreview()' class='px-5 py-2.5 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center gap-2 shadow-sm active:scale-95' style='background-color:var(--clr-p)'>
          <span>Lihat Pratinjau Cetak</span> <i class='fa-solid fa-arrow-right'></i>
        </button>

        <!-- When on Step 2 (Preview) -->
        <div id='pricetag-preview-actions' class='hidden flex flex-wrap items-center gap-2'>
          <button type='button' onclick='executePrintPricetags()' class='px-4 py-2.5 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center gap-1.5 shadow-sm active:scale-95' style='background-color:var(--clr-p)'>
            <i class='fa-solid fa-print'></i> <span>Cetak</span>
          </button>
          <button type='button' onclick='downloadPricetagPdf()' class='px-4 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl text-xs sm:text-sm transition-all flex items-center gap-1.5 shadow-sm active:scale-95'>
            <i class='fa-solid fa-file-pdf'></i> <span>PDF A4</span>
          </button>
          <button type='button' onclick='downloadPricetagImage()' class='px-3.5 py-2.5 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 font-bold rounded-xl text-xs transition-all flex items-center gap-1.5 active:scale-95 border border-slate-200 dark:border-slate-600'>
            <i class='fa-solid fa-image'></i> <span class='hidden sm:inline'>Gambar</span>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>
