<!-- ========================================================================= -->
<!-- MODAL: PRICETAG & LABEL BARCODE STUDIO (CETAK LABEL HARGA RAK / GONDOLA)   -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[85] bg-slate-950/75 hidden opacity-0 transition-opacity duration-300 flex items-end sm:items-center justify-center p-0 sm:p-4' id='pricetag-modal' onclick='if(event.target===this) closePricetagModal()'>
  <div class='w-full max-w-full sm:max-w-4xl md:max-w-5xl lg:max-w-6xl xl:max-w-7xl bg-white dark:bg-slate-900 rounded-t-3xl sm:rounded-3xl max-h-[96dvh] flex flex-col transform translate-y-6 sm:translate-y-0 transition-transform duration-300 shadow-2xl border border-slate-200 dark:border-slate-800 relative overflow-hidden' id='pricetag-modal-box'>
    
    <!-- Top Header Synchronized with Theme -->
    <div class='glass-header sticky top-0 z-30 px-4 sm:px-6 py-3.5 sm:py-4 flex items-center justify-between shadow-md shrink-0 sm:rounded-t-3xl' style='background-color:var(--clr-p, #059669)!important;'>
      <div class='flex items-center gap-3 min-w-0 flex-1 text-white'>
        <div class='w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-white/20 flex items-center justify-center text-white shrink-0 border border-white/30 backdrop-blur-md shadow-xs'>
          <i class='fa-solid fa-tags text-base text-white'></i>
        </div>
        <div class='min-w-0'>
          <div class='flex items-center gap-2'>
            <h3 class='text-sm sm:text-base font-black text-white tracking-tight truncate'>Pricetag &amp; Label Barcode Studio</h3>
            <span class='px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wider bg-white/25 text-white border border-white/30 hidden sm:inline-block'>Pro Shelf Tag</span>
          </div>
          <p class='text-[10.5px] sm:text-[11.5px] text-white/80 font-medium truncate'>Cetak label harga rak, barcode varian &amp; promo grosir</p>
        </div>
      </div>

      <div class='flex items-center gap-2 shrink-0'>
        <button type='button' onclick='printPricetags()' class='hidden sm:flex items-center gap-2 px-4 py-2 rounded-xl bg-white text-slate-900 font-extrabold text-xs shadow-lg hover:bg-slate-100 transition-all active:scale-95'>
          <i class='fa-solid fa-print text-emerald-600'></i> Cetak Sekarang
        </button>
        <button type='button' class='w-9 h-9 flex items-center justify-center rounded-full bg-white/20 hover:bg-rose-600 text-white transition-all border border-white/30 shadow-sm backdrop-blur-sm active:scale-95' onclick='closePricetagModal()' title='Tutup'>
          <i class='fa-solid fa-xmark text-sm text-white'></i>
        </button>
      </div>
    </div>

    <!-- Main Workspace (Split Grid: Left Config / Right Live Preview) -->
    <div class='flex-1 overflow-y-auto bg-slate-50 dark:bg-slate-950 p-3 sm:p-5 flex flex-col lg:flex-row gap-4 sm:gap-6'>
      
      <!-- LEFT PANE: CONFIGURATION & ITEM LIST (Width: 45% on Desktop) -->
      <div class='w-full lg:w-[48%] xl:w-[44%] flex flex-col space-y-4 shrink-0'>
        
        <!-- 1. Quick Toolbar & Product Adder -->
        <div class='p-3.5 sm:p-4 bg-white dark:bg-slate-800/90 rounded-2xl border border-slate-200/90 dark:border-slate-700/80 shadow-xs space-y-3'>
          <div class='flex items-center justify-between gap-2 flex-wrap'>
            <label class='text-xs font-black text-slate-800 dark:text-white uppercase tracking-wider flex items-center gap-1.5'>
              <i class='fa-solid fa-boxes-stacked text-emerald-500'></i> Daftar Produk yang Dicetak (<span id='pt-item-count'>0</span>)
            </label>
            <div class='flex items-center gap-1.5'>
              <button type='button' onclick='openPricetagProductPicker()' class='px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-sm active:scale-95 transition-all'>
                <i class='fa-solid fa-plus text-[11px]'></i> Tambah Produk
              </button>
              <button type='button' onclick='clearPricetagItems()' class='p-2 rounded-xl text-slate-400 hover:text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-900/30 transition-all text-xs' title='Kosongkan Semua Item'>
                <i class='fa-solid fa-trash-can'></i>
              </button>
            </div>
          </div>

          <!-- Quick Batch Actions -->
          <div class='flex items-center gap-1.5 flex-wrap pt-1 border-t border-slate-100 dark:border-slate-700/60'>
            <span class='text-[10px] font-bold text-slate-400'>Batch Cepat:</span>
            <button type='button' onclick='addAllPricetags()' class='px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold text-[10px] transition-all'>
              + Semua Produk
            </button>
            <button type='button' onclick='openPricetagBatchCategoryPicker()' class='px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold text-[10px] transition-all'>
              + Per Kategori
            </button>
            <button type='button' onclick='openPricetagBatchSupplierPicker()' class='px-2 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold text-[10px] transition-all'>
              + Per Supplier
            </button>
            <div class='ml-auto flex items-center gap-1'>
              <span class='text-[10px] font-bold text-slate-400'>Set Qty:</span>
              <button type='button' onclick='setAllPricetagQty(1)' class='px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-[10px] font-bold hover:bg-emerald-500 hover:text-white'>1</button>
              <button type='button' onclick='setAllPricetagQty(2)' class='px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-[10px] font-bold hover:bg-emerald-500 hover:text-white'>2</button>
              <button type='button' onclick='setAllPricetagQty(5)' class='px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-700 text-[10px] font-bold hover:bg-emerald-500 hover:text-white'>5</button>
            </div>
          </div>
        </div>

        <!-- 2. Selected Items Container (Scrollable) -->
        <div class='flex-1 max-h-[42vh] lg:max-h-[38vh] overflow-y-auto space-y-2.5 pr-1' id='pt-items-list'>
          <!-- Dynamic Item Rows Rendered by pricetag.js -->
        </div>

        <!-- 3. Paper Size & Template Design Settings Card -->
        <div class='p-3.5 sm:p-4 bg-white dark:bg-slate-800/90 rounded-2xl border border-slate-200/90 dark:border-slate-700/80 shadow-xs space-y-3.5'>
          <h4 class='text-xs font-black text-slate-800 dark:text-white uppercase tracking-wider flex items-center gap-1.5'>
            <i class='fa-solid fa-sliders text-indigo-500'></i> Pengaturan Kertas &amp; Format Label
          </h4>

          <div class='grid grid-cols-1 sm:grid-cols-2 gap-3'>
            <!-- Paper Size -->
            <div>
              <label class='block text-[10px] font-bold text-slate-400 uppercase mb-1'>Ukuran &amp; Jenis Kertas</label>
              <div class='relative'>
                <select id='pt-paper-type' onchange='onPricetagSettingChange()' class='admin-input !py-2 !text-xs font-bold w-full appearance-none cursor-pointer bg-slate-50 dark:bg-slate-900'>
                  <optgroup label="📄 Kertas A4 Potret Standar (Tom &amp; Jerry / HVS)">
                    <option value="a4_3x8" selected>A4 Potret (3 Kolom x 8 Baris = 24 Label/Lembar)</option>
                    <option value="a4_2x6">A4 Potret Besar (2 Kolom x 6 Baris = 12 Label/Lembar)</option>
                    <option value="a4_4x10">A4 Potret Mini (4 Kolom x 10 Baris = 40 Label/Lembar)</option>
                  </optgroup>
                  <optgroup label="🖨️ Printer Thermal POS Kasir (Opsional)">
                    <option value="thermal_58">Thermal 58mm Roll</option>
                    <option value="thermal_80">Thermal 80mm Roll</option>
                  </optgroup>
                </select>
                <i class='fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[10px]'></i>
              </div>
            </div>

            <!-- Layout Template Style -->
            <div>
              <label class='block text-[10px] font-bold text-slate-400 uppercase mb-1'>Desain / Tipe Label</label>
              <div class='relative'>
                <select id='pt-layout-template' onchange='onPricetagSettingChange()' class='admin-input !py-2 !text-xs font-bold w-full appearance-none cursor-pointer bg-slate-50 dark:bg-slate-900'>
                  <option value="gondola_standard" selected>Standar Gondola / Minimarket</option>
                  <option value="gondola_wholesale">Lengkap Info Grosir &amp; Promo</option>
                  <option value="mini_barcode">Kompak Mini (Barcode + Harga)</option>
                </select>
                <i class='fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none text-[10px]'></i>
              </div>
            </div>
          </div>

          <!-- Toggles -->
          <div class='grid grid-cols-2 sm:grid-cols-3 gap-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 text-[11px] font-semibold text-slate-700 dark:text-slate-300'>
            <label class='flex items-center gap-2 cursor-pointer select-none'>
              <input type='checkbox' id='pt-opt-store-name' checked onchange='onPricetagSettingChange()' class='w-3.5 h-3.5 text-emerald-600 rounded border-slate-300' />
              <span>Nama Toko</span>
            </label>
            <label class='flex items-center gap-2 cursor-pointer select-none'>
              <input type='checkbox' id='pt-opt-barcode' checked onchange='onPricetagSettingChange()' class='w-3.5 h-3.5 text-emerald-600 rounded border-slate-300' />
              <span>Barcode / SKU</span>
            </label>
            <label class='flex items-center gap-2 cursor-pointer select-none'>
              <input type='checkbox' id='pt-opt-wholesale' checked onchange='onPricetagSettingChange()' class='w-3.5 h-3.5 text-emerald-600 rounded border-slate-300' />
              <span>Tier Grosir</span>
            </label>
            <label class='flex items-center gap-2 cursor-pointer select-none'>
              <input type='checkbox' id='pt-opt-date' checked onchange='onPricetagSettingChange()' class='w-3.5 h-3.5 text-emerald-600 rounded border-slate-300' />
              <span>Tgl Cetak</span>
            </label>
            <label class='flex items-center gap-2 cursor-pointer select-none'>
              <input type='checkbox' id='pt-opt-cut-guide' checked onchange='onPricetagSettingChange()' class='w-3.5 h-3.5 text-emerald-600 rounded border-slate-300' />
              <span>Garis Potong</span>
            </label>
            <label class='flex items-center gap-2 cursor-pointer select-none'>
              <input type='checkbox' id='pt-opt-unit' checked onchange='onPricetagSettingChange()' class='w-3.5 h-3.5 text-emerald-600 rounded border-slate-300' />
              <span>Satuan Unit</span>
            </label>
          </div>
        </div>

      </div>

      <!-- RIGHT PANE: LIVE INTERACTIVE PREVIEW & SHEET RENDERER (Width: 55% on Desktop) -->
      <div class='flex-1 flex flex-col bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/90 dark:border-slate-800 p-4 sm:p-5 shadow-sm min-h-[420px]'>
        
        <!-- Preview Header Info Bar -->
        <div class='flex items-center justify-between pb-3 mb-3 border-b border-slate-100 dark:border-slate-800 gap-2 flex-wrap'>
          <div class='flex items-center gap-2'>
            <span class='w-7 h-7 rounded-xl bg-amber-50 dark:bg-amber-950/40 text-amber-600 dark:text-amber-400 flex items-center justify-center text-xs font-bold'>
              <i class='fa-solid fa-eye'></i>
            </span>
            <div>
              <h4 class='text-xs sm:text-sm font-black text-slate-800 dark:text-white leading-none'>Pratinjau Cetak Real-Time</h4>
              <p class='text-[10px] text-slate-400 mt-0.5' id='pt-preview-summary'>0 label • 0 lembar</p>
            </div>
          </div>
          <div class='flex items-center gap-2'>
            <span class='px-2.5 py-1 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-[10px] font-mono font-bold' id='pt-badge-paper-format'>A4 Grid 3x8</span>
            <button type='button' onclick='printPricetags()' class='sm:hidden px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-bold text-xs flex items-center gap-1 shadow-sm'>
              <i class='fa-solid fa-print'></i> Cetak
            </button>
          </div>
        </div>

        <!-- Preview Sheet Area (Styled like Physical Paper) -->
        <div class='flex-1 overflow-auto bg-slate-100 dark:bg-slate-950/70 p-2 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 flex justify-center items-start min-h-[350px] max-h-[62vh]' id='pt-preview-scroll-container'>
          <div id='pt-live-preview-sheet' class='bg-white text-black shadow-lg rounded-sm transition-all origin-top'>
            <!-- Dynamic Label Cards Grid Rendered by pricetag.js -->
          </div>
        </div>

      </div>

    </div>

    <!-- Modal Footer Actions -->
    <div class='p-3.5 sm:p-4 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-3 shrink-0 rounded-b-3xl'>
      <button type='button' onclick='closePricetagModal()' class='px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-bold text-xs hover:bg-slate-100 dark:hover:bg-slate-800 transition-all'>
        Tutup
      </button>
      <div class='flex items-center gap-2'>
        <button type='button' onclick='printPricetags()' class='btn-solid no-glass px-5 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs flex items-center gap-2 shadow-md active:scale-95 transition-all'>
          <i class='fa-solid fa-print text-sm'></i> Cetak Label Harga (Print)
        </button>
      </div>
    </div>

  </div>
</div>
