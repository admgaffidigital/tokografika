<!-- ========================================================================= -->
<!-- MODAL: QUICK EDIT PRODUK (STOK, HPP, HARGA, STATUS TOKO)                 -->
<!-- ========================================================================= -->
<div class='fixed inset-0 z-[110] bg-slate-900/70 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 opacity-0 transition-opacity duration-300' id='quick-edit-modal' onclick='if(event.target===this) closeQuickEditModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-t-2xl sm:rounded-2xl w-full max-w-full sm:max-w-lg md:max-w-xl max-h-[92dvh] sm:max-h-[88dvh] flex flex-col hide-scrollbar no-scrollbar shadow-2xl border border-slate-200/80 dark:border-slate-700/80 relative transform translate-y-full sm:translate-y-0 sm:scale-95 transition-all duration-300 overflow-hidden' id='quick-edit-modal-box'>
    
    <!-- Mobile Grab Bar Handle -->
    <div class='w-full pt-2.5 pb-1 flex justify-center sm:hidden shrink-0 bg-white dark:bg-slate-800'>
      <div class='w-12 h-1.5 rounded-full bg-slate-300 dark:bg-slate-600'></div>
    </div>

    <!-- Modal Header -->
    <div class='sticky top-0 bg-white/95 dark:bg-slate-800/95 backdrop-blur-sm px-4 sm:px-6 py-3.5 border-b border-slate-100 dark:border-slate-700/80 flex justify-between items-center z-20 shrink-0'>
      <div class='flex items-center gap-3 min-w-0'>
        <div class='w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-900/30 text-amber-500 flex items-center justify-center text-lg shrink-0 shadow-sm border border-amber-200/60 dark:border-amber-800/50'>
          <i class='fa-solid fa-bolt'></i>
        </div>
        <div class='min-w-0'>
          <h3 class='font-bold text-slate-900 dark:text-white text-sm sm:text-base tracking-tight truncate'>Edit Cepat Produk</h3>
          <p class='text-[10px] sm:text-xs font-semibold text-slate-400 truncate' id='qe-product-subtitle'>Ubah Stok, HPP Modal & Harga Jual</p>
        </div>
      </div>
      <button class='w-8 h-8 flex items-center justify-center rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 dark:hover:text-rose-400 transition-all border border-slate-200 dark:border-slate-600 shrink-0 ml-2' onclick='closeQuickEditModal()' title='Tutup'>
        <i class='fa-solid fa-xmark text-sm'></i>
      </button>
    </div>

    <!-- Modal Form Body -->
    <div class='p-4 sm:p-6 overflow-y-auto flex-1 text-slate-700 dark:text-slate-200 space-y-4' id='quick-edit-modal-content'>
      <!-- Injected dynamically via JS -->
    </div>

    <!-- Modal Footer Actions -->
    <div class='sticky bottom-0 bg-slate-50 dark:bg-slate-900/95 backdrop-blur-sm px-4 sm:px-6 py-3.5 border-t border-slate-100 dark:border-slate-700/80 flex items-center justify-end gap-3 z-20 shrink-0'>
      <button type='button' onclick='closeQuickEditModal()' class='px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 font-bold text-xs transition-all'>
        Batal
      </button>
      <button type='button' onclick='saveQuickEditProduct()' id='btn-save-quick-edit' class='px-6 py-2.5 rounded-xl text-white font-bold text-xs transition-all shadow-md flex items-center gap-2' style='background-color:var(--clr-p)'>
        <i class='fa-solid fa-check'></i>
        <span>Simpan Perubahan</span>
      </button>
    </div>

  </div>
</div>
