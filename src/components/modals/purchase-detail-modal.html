<!-- ========================================================================= -->
<!-- MODAL: DETAIL FAKTUR PEMBELIAN & CETAK NOTA                               -->
<!-- ========================================================================= -->
<div class="fixed inset-0 bg-slate-900/70 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4 z-[60] opacity-0 modal-backdrop-smooth hidden" id="purchase-detail-modal" onclick="if(event.target===this) closePurchaseDetailModal()">
  <div class="bg-white dark:bg-slate-900 w-full max-w-full sm:max-w-2xl md:max-w-3xl lg:max-w-4xl rounded-t-[2rem] sm:rounded-3xl shadow-2xl border-t sm:border border-slate-200 dark:border-slate-800 flex flex-col overflow-hidden max-h-[92dvh] sm:max-h-[88dvh] transform translate-y-full sm:translate-y-0 sm:scale-95 bottom-sheet-smooth" id="purchase-detail-box">
    
    <!-- Mobile Drag Handle -->
    <div class="sm:hidden w-12 h-1 bg-slate-300 dark:bg-slate-700 rounded-full mx-auto mt-2.5 mb-1 shrink-0"></div>

    <!-- Modal Header -->
    <div class="px-5 py-3.5 sm:py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between bg-slate-50/70 dark:bg-slate-800/50 shrink-0">
      <div class="flex items-center gap-2.5 sm:gap-3 min-w-0">
        <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center text-base sm:text-lg shrink-0">
          <i class="fa-solid fa-file-invoice"></i>
        </div>
        <div class="min-w-0">
          <h3 class="font-extrabold text-xs sm:text-base text-slate-800 dark:text-white leading-tight truncate" id="purch-detail-inv-title">Faktur Pembelian</h3>
          <p class="text-[10px] text-slate-400 font-medium truncate" id="purch-detail-inv-date">-</p>
        </div>
      </div>
      <button type="button" class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 flex items-center justify-center transition-colors shrink-0" onclick="closePurchaseDetailModal()" title="Tutup">
        <i class="fa-solid fa-xmark text-sm"></i>
      </button>
    </div>

    <!-- Modal Body (Printable Area) -->
    <div class="p-3.5 sm:p-5 overflow-y-auto space-y-3.5 sm:space-y-4 custom-scrollbar text-xs flex-1" id="purch-detail-printable-content">
      <!-- Populated dynamically by JS -->
    </div>

    <!-- Modal Footer -->
    <div class="px-4 sm:px-5 py-3 sm:py-3.5 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2 bg-slate-50/90 dark:bg-slate-800/80 backdrop-blur-sm shrink-0">
      <button type="button" class="px-3.5 sm:px-4 py-2 sm:py-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold transition-all text-xs flex items-center gap-1.5 active:scale-95 shadow-xs" onclick="printPurchaseInvoice()">
        <i class="fa-solid fa-print text-indigo-500"></i> <span>Cetak Faktur</span>
      </button>
      <button type="button" class="px-5 py-2 sm:py-2.5 rounded-xl bg-slate-800 dark:bg-slate-700 text-white font-bold hover:bg-slate-900 dark:hover:bg-slate-600 transition-all text-xs active:scale-95 shadow-sm" onclick="closePurchaseDetailModal()">
        Tutup
      </button>
    </div>

  </div>
</div>
