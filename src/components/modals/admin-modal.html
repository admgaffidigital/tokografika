<div class='fixed inset-0 z-[80] bg-slate-900/70 hidden flex items-center justify-center p-3 sm:p-6 opacity-0 transition-opacity duration-300' id='admin-modal' onclick='if(event.target===this) closeAdminModal()'>
  <div class='bg-white dark:bg-slate-800 rounded-[1.5rem] w-full max-w-md sm:max-w-xl md:max-w-2xl max-h-[92dvh] flex flex-col hide-scrollbar shadow-2xl border-2 border-slate-200 dark:border-slate-700 relative transform scale-95 transition-transform duration-300' id='admin-modal-box'>
    <div class='sticky top-0 bg-white dark:bg-slate-800 px-5 py-4 border-b-2 border-slate-200 dark:border-slate-700 flex justify-between items-center z-20 rounded-t-[1.5rem]'>
      <h3 class='font-bold text-slate-900 dark:text-white text-sm flex items-center gap-2' id='admin-modal-title'>Form Data</h3>
      <button class='w-8 h-8 flex items-center justify-center rounded-full bg-slate-50 dark:bg-slate-700 text-slate-500 dark:text-slate-300 hover:bg-rose-50 dark:hover:bg-rose-900/30 hover:text-rose-500 dark:hover:text-rose-400 transition-all border-2 border-slate-200 dark:border-slate-600' onclick='closeAdminModal()'>
        <i class='fa-solid fa-xmark'></i>
      </button>
    </div>
    <div class='p-5 space-y-4 overflow-y-auto flex-1 bg-slate-50 dark:bg-slate-900' id='admin-modal-form'></div>
    <div class='p-4 sticky bottom-0 bg-white dark:bg-slate-800 border-t-2 border-slate-200 dark:border-slate-700 z-20 rounded-b-[1.5rem] shrink-0'>
      <button class='btn-primary w-full py-3.5 text-sm' onclick='submitAdminForm()'>
        <i class='fa-solid fa-save mr-1.5'></i> Simpan Data
      </button>
    </div>
  </div>
</div>
