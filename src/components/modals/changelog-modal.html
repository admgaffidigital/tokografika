<!-- CHANGELOG MODAL -->
<div id="changelog-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-3 sm:p-4 opacity-0 modal-backdrop-smooth">
  <div class="absolute inset-0 bg-slate-900/40 dark:bg-slate-900/60 backdrop-blur-sm" onclick="closeChangelogModal()"></div>
  <div id="changelog-modal-box" class="relative w-full max-w-lg bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-white/20 dark:border-slate-700/50 rounded-2xl sm:rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[85vh] scale-95 modal-box-smooth">
    
    <!-- Header -->
    <div class="px-4 sm:px-6 py-4 flex items-center justify-between border-b border-slate-200/50 dark:border-slate-700/50">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-indigo-50 dark:bg-indigo-900/30 flex items-center justify-center text-indigo-600 dark:text-indigo-400">
          <i class="fa-solid fa-clock-rotate-left text-lg"></i>
        </div>
        <div>
          <h3 class="font-black text-slate-800 dark:text-white text-base sm:text-lg">Riwayat Pembaruan</h3>
          <p class="text-[10px] sm:text-xs text-slate-500 font-medium">Changelog & Fitur Terbaru</p>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button type="button" id="btn-refresh-changelog" onclick="fetchChangelogData(true)" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-500 hover:text-indigo-600 flex items-center justify-center transition-colors" title="Muat Ulang Riwayat">
          <i class="fa-solid fa-rotate text-xs"></i>
        </button>
        <button type="button" onclick="closeChangelogModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-500 flex items-center justify-center transition-colors" title="Tutup">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>
    </div>

    <!-- Body -->
    <div class="flex-1 overflow-y-auto p-4 sm:p-6 custom-scrollbar" id="changelog-content">
      <div class="flex items-center justify-center py-10 flex-col gap-3">
        <div class="animate-spin text-indigo-500 text-2xl">
          <i class="fa-solid fa-circle-notch"></i>
        </div>
        <p class="text-xs text-slate-500 font-bold animate-pulse">Memuat riwayat pembaruan...</p>
      </div>
    </div>
  </div>
</div>
